<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-label="WorlDDriver – das erste D ist gespiegelt">
  <title>WorlᗡDriver</title>
  <rect width="520" height="120" rx="20" fill="#0d1117"/>
  <g font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f0efec">
    <text x="34" y="82" textLength="146" lengthAdjust="spacingAndGlyphs">Worl</text>
    <!-- gespiegeltes D: an seiner eigenen Mittelachse horizontal gespiegelt -->
    <g transform="translate(232 0) scale(-1 1)">
      <text x="0" y="82" fill="#3987e5" textLength="46" lengthAdjust="spacingAndGlyphs">D</text>
    </g>
    <text x="236" y="82" fill="#3987e5" textLength="46" lengthAdjust="spacingAndGlyphs">D</text>
    <text x="284" y="82" textLength="200" lengthAdjust="spacingAndGlyphs">river</text>
  </g>
  <rect x="34" y="96" width="450" height="3" rx="1.5" fill="#3987e5" opacity="0.55"/>
</svg>
