<title>WorlᗡDriver</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="WorlᗡDriver – Prognosen und Wirtschaftsbeziehungen für die 8 Hauptwährungen und ihre 28 Paare">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: Kopfzeile mit Logo + Status, darunter Reiter; Inhalt als ruhige Spalte (max. 1100px), Karten nur wo sie Objekte trennen */
/* Layout: Kopfleiste mit Menü-Knopf und Seitentitel, ausklappbares Seitenmenü; Inhalt als ruhige Spalte bis 1100px.
   Ton: redaktionell – große Aussage oben, darunter belegte Fakten mit Quellen-Verweisen [1]. */
:root{
  color-scheme:dark;
  --bg:#0c0e13; --surface:#13161d; --surface-2:#1a1e27; --line:#272c38; --line-soft:#1d212b;
  --fg:#eef0f4; --fg-2:#a7adbb; --fg-3:#767d8e;
  --accent:#7b93ff; --accent-ink:#0c0e13;
  --strong:#7cb6ff; --weak:#f2a65e; --bull:#4fb3a4; --bear:#ef8d4f; --neutral:#7f8697;
  --pink:#ef6f8f; --red:#e5484d; --orange:#f0913a; --yellow:#e2b43c; --holiday:#8a90a0;
  --good:#3fb97e; --warn:#e2b43c; --bad:#e5484d;
  --font-display:"Inter Tight","Inter",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;--bg:#f6f7f9;--surface:#ffffff;--surface-2:#eef0f4;--line:#d9dde6;--line-soft:#e7eaf0;
  --fg:#12141a;--fg-2:#4a5162;--fg-3:#6f7687;--accent:#4a5fe0;--accent-ink:#ffffff;
  --strong:#2367c9;--weak:#c0661c;--bull:#17806f;--bear:#c25a1a;--neutral:#7a8090;
  --pink:#c9416a;--red:#d1343a;--orange:#d9761e;--yellow:#b88a0e;--holiday:#7a8090;--good:#1f8a50;--warn:#a87508;--bad:#c23a24}}
:root[data-theme="light"]{
  color-scheme:light;--bg:#f6f7f9;--surface:#ffffff;--surface-2:#eef0f4;--line:#d9dde6;--line-soft:#e7eaf0;
  --fg:#12141a;--fg-2:#4a5162;--fg-3:#6f7687;--accent:#4a5fe0;--accent-ink:#ffffff;
  --strong:#2367c9;--weak:#c0661c;--bull:#17806f;--bear:#c25a1a;--neutral:#7a8090;
  --pink:#c9416a;--red:#d1343a;--orange:#d9761e;--yellow:#b88a0e;--holiday:#7a8090;--good:#1f8a50;--warn:#a87508;--bad:#c23a24}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:1rem}
p{margin:0}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Kopf und Seitenmenü */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:10px}
.iconbtn{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;color:var(--fg);flex:none}
.iconbtn:hover{background:var(--surface-2)}
.top-title{font-weight:600;font-size:1rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.brand{display:flex;align-items:center;text-decoration:none;color:var(--fg)}
.brand svg{height:22px;width:auto;display:block}
.status{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.76rem;color:var(--fg-2);white-space:nowrap;background:var(--surface);font-family:var(--font-data)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fg-3);flex:none}
.dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.live{background:var(--accent)}
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:40}
aside.drawer{position:fixed;top:0;bottom:0;left:0;width:min(340px,88vw);z-index:50;background:var(--surface);border-right:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 18px) 16px calc(env(safe-area-inset-bottom,0px) + 18px) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;overflow-y:auto;transform:translateX(-102%);transition:transform .2s ease}
aside.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){aside.drawer{transition:none}}
.drawer-head{display:flex;justify-content:space-between;align-items:center}
.drawer nav{display:grid;gap:2px}
.drawer nav a{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--fg);padding:10px 12px;border-radius:10px;font-size:1rem}
.drawer nav a svg{width:20px;height:20px;color:var(--fg-2);flex:none}
.drawer nav a[aria-current="page"]{background:var(--surface-2)}
.drawer nav a span.k{margin-left:auto;font-family:var(--font-data);font-size:.72rem;color:var(--fg-3)}
.drawer .sep{height:1px;background:var(--line-soft)}
.next-ev{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:center;text-decoration:none;color:var(--fg)}
.next-ev small{grid-column:2;color:var(--fg-3);font-family:var(--font-data);font-size:.76rem}
.folder{display:inline-block;width:16px;height:12px;flex:none;vertical-align:middle}
main{padding-block:20px 48px}
section.view{display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
section.view>*,.grid-2>*,.grid-3>*,.kpis>*{min-width:0}
.lede{display:grid;gap:6px}
.lede h1{font-size:clamp(2.1rem,7.5vw,3.4rem);font-weight:800;letter-spacing:-.04em;line-height:1.04}
.lede p{max-width:68ch;color:var(--fg-2)}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.label{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);font-weight:600}
.grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:760px){.grid-3,.grid-2{grid-template-columns:minmax(0,1fr)}}

/* Horizont-Karten */
.hz{display:grid;gap:10px;align-content:start;min-width:0}
.hz .verdict{font-size:.92rem}
.kv{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:6px 14px;font-size:.88rem}
.hz .kv{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.kv dt{color:var(--fg-2)} .kv dd{margin:0;text-align:right}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:600;border:1px solid transparent;white-space:nowrap}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:color-mix(in srgb,var(--good) 12%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:color-mix(in srgb,var(--warn) 12%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:color-mix(in srgb,var(--bad) 12%,transparent)}
.pill.info{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 45%,transparent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.pill.plain{color:var(--fg-2);border-color:var(--line)}
.pill.dashed{color:var(--fg-3);border:1px dashed var(--line)}

/* Währungsstärke */
.ccy{font-family:var(--font-display);font-weight:600}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;text-align:center;padding:5px 12px;border-radius:7px;font-size:.86rem;color:var(--fg-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .25)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{all:unset;cursor:pointer;font-size:.82rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--fg-2)}
.chips button[aria-pressed="true"]{border-color:var(--accent);color:var(--fg);background:color-mix(in srgb,var(--accent) 14%,transparent)}
select{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:.86rem}

/* Prognoseliste */
.fc-list{display:grid;gap:8px}
.fc{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);overflow:hidden}
.fc>button{all:unset;cursor:pointer;display:grid;grid-template-columns:96px minmax(0,1fr) 150px 90px;gap:14px;align-items:center;padding:12px 14px;width:100%;box-sizing:border-box}
.fc>button:hover{background:var(--surface-2)}
.fc .pair{font-family:var(--font-display);font-weight:600;font-size:1.02rem}
.fc .price{font-size:.8rem;color:var(--fg-3)}
.probbar{display:flex;height:22px;border-radius:6px;overflow:hidden;gap:2px;background:var(--bg)}
.probbar span{display:flex;align-items:center;justify-content:center;font-size:.72rem;font-family:var(--font-data);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.probbar .b{background:var(--bear)} .probbar .n{background:var(--neutral)} .probbar .u{background:var(--bull)}
.probmeta{display:flex;justify-content:space-between;font-size:.72rem;color:var(--fg-3);margin-top:4px}
.interval{font-size:.82rem;text-align:right}
.interval small{display:block;color:var(--fg-3);font-size:.72rem}
.fc .conf{justify-self:end}
.fc-detail{border-top:1px solid var(--line-soft);padding:16px 14px;display:grid;gap:16px}
@media (max-width:760px){
  .fc>button{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"pair conf" "bar bar" "int int";row-gap:10px}
  .fc>button .c-pair{grid-area:pair} .fc>button .c-bar{grid-area:bar} .fc>button .c-int{grid-area:int} .fc>button .conf{grid-area:conf}
  .interval{text-align:left}
}
.drivers{display:grid;gap:8px}
.drv{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:.88rem}
.drv-bar{position:relative;height:8px;background:var(--surface-2);border-radius:4px}
.drv-bar i{position:absolute;top:0;height:8px;border-radius:4px}
.drv-bar .mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line)}
ul.plain{margin:0;padding-left:18px;display:grid;gap:4px;color:var(--fg-2);font-size:.9rem}
.note{font-size:.84rem;color:var(--fg-2);border-left:2px solid var(--line);padding-left:10px}

/* Diagramme */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--fg-3);font-family:var(--font-body);font-size:11px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--fg-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}

/* Tabellen */
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{padding:7px 10px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--fg-3);font-size:.74rem;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{font-family:var(--font-data)}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{display:grid;gap:2px}
.kpi b{font-family:var(--font-display);font-size:1.5rem;font-weight:600}

/* Karte */
.map-wrap{position:relative}
svg.map{width:100%;height:auto;display:block}
svg.map path.land{fill:var(--surface-2);stroke:var(--bg);stroke-width:.4}
svg.map path.eco{fill:color-mix(in srgb,var(--accent) 30%,var(--surface-2))}
svg.map path.eco.sel{fill:color-mix(in srgb,var(--accent) 55%,var(--surface-2))}
svg.map .flow{fill:none;stroke-width:1.6;stroke-linecap:round}
svg.map .marker{cursor:pointer}
svg.map .marker circle{fill:var(--bg);stroke:var(--accent);stroke-width:1.6}
svg.map .marker circle.hit{fill:transparent;stroke:none}
svg.map .marker.sel circle{fill:var(--accent)}
svg.map .marker text{font-family:var(--font-display);font-weight:600;fill:var(--fg);paint-order:stroke;stroke:var(--bg)}
svg.map .flowlabel{fill:var(--fg-2);paint-order:stroke;stroke:var(--bg)}

/* Beziehungen */
.deps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:760px){.deps{grid-template-columns:minmax(0,1fr)}}
.dep{display:grid;gap:10px;align-content:start;min-width:0}
.dep-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.dep-title{font-family:var(--font-display);font-weight:600}
ol.chain{margin:0;padding-left:20px;display:grid;gap:3px;font-size:.88rem;color:var(--fg-2)}
.stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.8rem;color:var(--fg-2)}
.stats b{color:var(--fg);font-weight:500}
.subs{display:inline-flex;gap:4px;vertical-align:middle}
.subs i{width:10px;height:10px;border-radius:50%;display:inline-block;border:1px solid var(--line)}
details summary{cursor:pointer;color:var(--fg-2);font-size:.86rem}
.empty{padding:22px;border:1px dashed var(--line);border-radius:var(--r);color:var(--fg-2);display:grid;gap:6px}
footer{border-top:1px solid var(--line-soft);padding-block:20px 32px;color:var(--fg-3);font-size:.8rem;display:grid;gap:6px}
@media (prefers-reduced-motion:no-preference){.fc-detail{animation:open .18s ease-out}@keyframes open{from{opacity:.4;transform:translateY(-4px)}to{opacity:1;transform:none}}}

/* Redaktionelle Seiten (Cockpit, Paare, Kalender, COT, Saisonalität) */
h1,h2,h3{font-family:var(--font-display)}
.eyebrow{font-family:var(--font-data);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.eyebrow b{color:var(--accent);font-weight:600}
.hero{display:grid;gap:18px;padding-block:6px 4px}
.hero h1{font-weight:800;font-size:clamp(2.5rem,10.5vw,5rem);line-height:1;letter-spacing:-.045em}
.hero h1 .s{color:var(--strong)} .hero h1 .w{color:var(--weak)}
.brief{font-family:var(--font-display);font-weight:500;font-size:clamp(1.12rem,4.4vw,1.55rem);line-height:1.5;color:var(--fg-2);max-width:42ch;letter-spacing:-.01em}
.brief b{color:var(--fg);font-weight:600} .brief .s{color:var(--strong)} .brief .w{color:var(--weak)} .brief .y{color:var(--yellow)}
sup.ref{font-family:var(--font-data);font-size:.58em;margin-left:2px}
sup.ref a{color:var(--accent);text-decoration:none}
.srcline{display:flex;gap:8px;align-items:center;font-size:.84rem;color:var(--fg-3)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{display:grid;gap:4px}
.tile .big{font-family:var(--font-display);font-weight:700;font-size:clamp(2.2rem,9vw,3.2rem);letter-spacing:-.03em;line-height:1}
.honest{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;font-size:.88rem;color:var(--fg-2);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.honest svg{color:var(--accent);margin-top:2px}
ol.sources{margin:0;padding-left:0;list-style:none;display:grid;gap:6px;font-size:.84rem;color:var(--fg-2)}
ol.sources li{display:grid;grid-template-columns:30px 1fr;gap:6px}
ol.sources li span:first-child{font-family:var(--font-data);color:var(--accent)}
.section-title{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.dir{display:inline-flex;align-items:center;justify-content:center;min-width:76px;font-family:var(--font-data);font-weight:600;font-size:.78rem;letter-spacing:.06em;border-radius:999px;padding:4px 10px;border:1px solid var(--line);color:var(--fg-3)}
.dir.long{color:var(--strong);border-color:color-mix(in srgb,var(--strong) 50%,transparent);background:color-mix(in srgb,var(--strong) 12%,transparent)}
.dir.short{color:var(--weak);border-color:color-mix(in srgb,var(--weak) 50%,transparent);background:color-mix(in srgb,var(--weak) 12%,transparent)}
.cdots{display:inline-flex;gap:4px;align-items:center;vertical-align:middle}
.cdots i{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--fg-3)}
.cdots i.on{background:var(--fg);border-color:var(--fg)}
.rows{display:grid}
.prow{display:grid;grid-template-columns:minmax(84px,1.1fr) auto minmax(70px,.8fr) minmax(56px,.6fr) minmax(70px,.7fr);gap:12px;align-items:center;padding:13px 4px;border-bottom:1px dashed var(--line-soft);text-decoration:none;color:var(--fg)}
.prow:hover{background:var(--surface)}
.prow .pair{font-family:var(--font-display);font-weight:700;font-size:1.05rem}
.prow.head{font-family:var(--font-data);font-size:.7rem;letter-spacing:.1em;color:var(--fg-3);text-transform:uppercase;border-bottom:1px solid var(--line)}
.prow .val{font-family:var(--font-data);font-size:.86rem}
.prow .val.s{color:var(--strong)} .prow .val.w{color:var(--weak)}
@media (max-width:560px){.prow{grid-template-columns:minmax(78px,1fr) auto auto;}.prow .hide-s{display:none}}
.ev{display:grid;grid-template-columns:72px 18px 38px minmax(0,1fr);gap:10px;align-items:center;padding:10px 4px;border-bottom:1px dashed var(--line-soft)}
.ev.past{opacity:.5}
.ev .t{font-family:var(--font-data);font-size:.82rem;color:var(--fg-2);white-space:nowrap;min-width:44px}
.ev .c{font-family:var(--font-data);font-weight:600;font-size:.82rem}
.ev.nodate{grid-template-columns:48px 18px 38px minmax(0,1fr)}
.ev .vals span{white-space:nowrap}
.ev .vals{grid-column:4;display:flex;flex-wrap:wrap;gap:4px 14px;font-family:var(--font-data);font-size:.76rem;color:var(--fg-3)}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:16px 4px 6px;border-bottom:1px solid var(--line)}
.dayhead h3{font-size:1.05rem}
.dayhead.today h3::after{content:"heute";margin-left:8px;font-family:var(--font-data);font-size:.68rem;letter-spacing:.08em;color:var(--accent);text-transform:uppercase;vertical-align:middle}
.days{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media (max-width:760px){.days{grid-template-columns:minmax(0,1fr)}}
.daycard{border:1px solid var(--line-soft);border-radius:12px;padding:10px 12px;display:grid;gap:6px;align-content:start;background:var(--surface)}
.daycard .d{font-family:var(--font-data);font-size:.74rem;color:var(--fg-3);text-transform:uppercase;letter-spacing:.06em}
.daycard .e{display:grid;grid-template-columns:auto 1fr;gap:6px;font-size:.84rem;align-items:start}
.factor{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;padding:10px 0;border-bottom:1px dashed var(--line-soft)}
.factor:last-child{border-bottom:0}
.sig{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-data);font-weight:700;font-size:.8rem;border:1px solid var(--line);color:var(--fg-3)}
.sig.up{color:var(--strong);border-color:color-mix(in srgb,var(--strong) 50%,transparent)}

<script>
const D = /*__WORLDDRIVER_DATA__*/null;
const $ = (s, el = document) => el.querySelector(s);
const nf = (d) => new Intl.NumberFormat("de-DE", {minimumFractionDigits: d, maximumFractionDigits: d});
const fmt = (x, d = 2) => x == null || isNaN(x) ? "–" : nf(d).format(x);
const pct = (x, d = 2, sign = true) => { if (x == null || isNaN(x)) return "–"; const v = Math.abs(x * 100) < 0.5 * 10 ** -d ? 0 : x * 100; return (sign && v > 0 ? "+" : "") + nf(d).format(v) + " %"; };
const pp = (x, d = 0) => x == null ? "–" : nf(d).format(x * 100) + " %";
const dateDe = (s) => s ? new Date(s + (s.length === 10 ? "T12:00:00" : "")).toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit", year: "numeric"}) : "–";
const pairName = (p) => p.slice(0, 3) + "/" + p.slice(3);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const HZ = {"1D": "Tag", "1W": "Woche", "1M": "Monat"};
const HZ_LONG = {"1D": "1 Handelstag", "1W": "5 Handelstage", "1M": "20 Handelstage"};
const state = {horizon: "1D", ccy: "ALLE", sort: "az", open: null, depCcy: "ALLE", mapSel: "AU"};
try { const s = JSON.parse(localStorage.getItem("wd-state") || "{}"); Object.assign(state, {horizon: s.horizon || state.horizon, sort: s.sort || state.sort}); } catch (e) {}
const save = () => { try { localStorage.setItem("wd-state", JSON.stringify({horizon: state.horizon, sort: state.sort})); } catch (e) {} };

function regimeOf(v) { return v == null ? "unbekannt" : v < 15 ? "ruhig" : v <= 25 ? "normal" : "Stress"; }

/* ---------- Bewertung der Modellgüte in Alltagssprache ---------- */
function horizonVerdict(h) {
  const b = D.backtest[h]; if (!b || !b.champion) return {cls: "plain", short: "Noch nicht trainiert", text: ""};
  const m = b.models[b.champion] || {}; const v = m.validation || {}, o = m.holdout || {};
  const best = Object.entries(b.models).filter(([k]) => k !== "climatology")
    .map(([k, x]) => [k, (x.validation || {}).bss]).sort((a, c) => (c[1] ?? -9) - (a[1] ?? -9))[0];
  const bestDir = Object.entries(b.models).filter(([k]) => k === "logreg" || k === "lgbm")
    .sort((a, c) => ((c[1].validation || {}).bss_vs_volref ?? -9) - ((a[1].validation || {}).bss_vs_volref ?? -9))[0];
  if (b.champion === "logreg" || b.champion === "lgbm") {
    return {cls: "good", short: "Richtungsvorteil",
      text: `${m.label} sagt besser voraus als beide Referenzen (gegenüber der Schwankungs-Referenz ${pct(v.bss_vs_volref, 2)}, Hold-out ab 2022 ${pct(o.bss_vs_volref, 2)}). Trefferquote Richtung ${pp(v.hit_rate, 1)}.`};
  }
  if (b.champion === "volref") {
    return {cls: "info", short: "Vorteil nur bei der Schwankung",
      text: `Die Schwankungs-Referenz ist besser als die reine Häufigkeit (${pct(v.bss, 2)}): Sie erkennt, ob ein ruhiger oder bewegter Markt zu erwarten ist. Bei der Richtung schlägt kein Modell diese Referenz belastbar (bestes: ${bestDir ? esc(bestDir[1].label) + " mit " + pct((bestDir[1].validation || {}).bss_vs_volref, 2) : "–"}).`};
  }
  return {cls: "warn", short: "Kein Modell besser als die Referenz",
    text: `Kein Modell schlägt die Referenz belastbar (bestes: ${best ? (b.models[best[0]].label) + " mit " + pct(best[1], 2) : "–"}). Angezeigt werden deshalb die historischen Häufigkeiten und die Schwankungsbreite.`};
}

/* ---------- Kopf und Fuß ---------- */
function renderChrome() {
  $("#foot").innerHTML = `
    <div>WorlᗡDriver · Prognose-Engine FOREX NEXUS AI · Version ${esc(D.meta.code_commit)} · erzeugt ${new Date(D.meta.generated_at).toLocaleString("de-DE")}</div>
    <div>Kursbasis: ${esc(D.meta.price_basis)}. ${esc(D.map.attribution)}.</div>
    <div>Persönliches Analysewerkzeug. Statistische Prognosen sind keine Anlageberatung und keine Handelssignale.</div>`;
}

/* ---------- Prognosen ---------- */
function hzCard(h) {
  const b = D.backtest[h], v = horizonVerdict(h), m = (b.models[b.champion] || {});
  const val = m.validation || {}, hold = m.holdout || {};
  return `<article class="panel hz">
    <div class="panel-head"><h3>${HZ[h]} <span class="faint">· ${HZ_LONG[h]}</span></h3><span class="pill ${v.cls}">${v.short}</span></div>
    <p class="verdict muted">${v.text}</p>
    <dl class="kv"><dt>Angezeigtes Modell</dt><dd>${esc(m.label || "–")}</dd><dt>Trefferquote Richtung</dt><dd class="num">${pp(val.hit_rate, 1)}</dd>
      <dt>80-%-Intervall traf</dt><dd class="num">${pp(val.coverage_80, 1)}</dd><dt>Hold-out ab 2022 (BSS)</dt><dd class="num">${pct(hold.bss, 2)}</dd></dl></article>`;
}
function viewForecasts() {
  const ccys = ["ALLE", ...D.majors];
  return `<section class="view">
    <div class="lede"><h1>Prognosen</h1>
      <p>Wahrscheinlichkeit für fallend, seitwärts und steigend, das 80-%-Prognoseintervall und die Konfidenz – je Horizont aus einem eigenen Modell. Tippe ein Paar an für Einflussfaktoren, Ungültigkeitsbedingungen und Modellgüte.</p></div>
    <div class="grid-3">${["1D", "1W", "1M"].map(hzCard).join("")}</div>
    <div class="toolbar">
      <div class="seg" role="group" aria-label="Horizont">${Object.keys(HZ).map((h) => `<button type="button" data-hz="${h}" aria-pressed="${state.horizon === h}">${HZ[h]}</button>`).join("")}</div>
      <label class="faint" style="font-size:.84rem">Sortieren <select id="sort">
        <option value="az">Paar A–Z</option><option value="bull">Wahrscheinlichkeit steigend</option>
        <option value="bear">Wahrscheinlichkeit fallend</option><option value="vol">Größte Schwankungsbreite</option></select></label>
    </div>
    <div class="chips" role="group" aria-label="Währung">${ccys.map((c) => `<button type="button" data-ccy="${c}" aria-pressed="${state.ccy === c}">${c === "ALLE" ? "Alle 28" : c}</button>`).join("")}</div>
    <div class="note" id="hz-note"></div>
    <div class="fc-list" id="fc-list"></div>
  </section>`;
}
function bindForecasts() {
  document.querySelectorAll("[data-hz]").forEach((b) => b.onclick = () => { state.horizon = b.dataset.hz; state.open = null; save(); route(); });
  document.querySelectorAll("[data-ccy]").forEach((b) => b.onclick = () => { state.ccy = b.dataset.ccy; route(); });
  const s = $("#sort"); s.value = state.sort; s.onchange = () => { state.sort = s.value; save(); renderList(); };
  const v = horizonVerdict(state.horizon);
  $("#hz-note").innerHTML = `<b>${HZ[state.horizon]}:</b> ${v.text}`;
  renderList();
}
function renderList() {
  let rows = D.forecasts.filter((f) => f.horizon === state.horizon && (state.ccy === "ALLE" || f.pair.includes(state.ccy)));
  const key = {az: (f) => f.pair, bull: (f) => -f.p_bull, bear: (f) => -f.p_bear, vol: (f) => -(f.quantiles.q90 - f.quantiles.q10)}[state.sort];
  rows.sort((a, b) => (key(a) < key(b) ? -1 : key(a) > key(b) ? 1 : 0));
  if (!rows.length) { $("#fc-list").innerHTML = `<div class="empty"><b>Keine Prognosen für diese Auswahl.</b><span>Prognosen entstehen täglich nach Kursschluss.</span></div>`; return; }
  $("#fc-list").innerHTML = rows.map((f) => {
    const q = f.quantiles, open = state.open === f.pair;
    const cls = f.confidence_label === "hoch" ? "good" : f.confidence_label === "mittel" ? "info" : "plain";
    return `<article class="fc"><button type="button" data-open="${f.pair}" aria-expanded="${open}">
      <div class="c-pair"><div class="pair">${pairName(f.pair)}</div><div class="price num">${fmt(f.price, f.pair.endsWith("JPY") ? 3 : 5)}</div></div>
      <div class="c-bar">${probBar(f)}</div>
      <div class="c-int interval num">${pct(q.q10)} … ${pct(q.q90)}<small>80-%-Intervall bis ${dateDe(f.target_date)}</small></div>
      <span class="conf pill ${cls}">Konfidenz ${f.confidence_label}</span>
    </button>${open ? detail(f) : ""}</article>`;}).join("");
  document.querySelectorAll("[data-open]").forEach((b) => b.onclick = () => { state.open = state.open === b.dataset.open ? null : b.dataset.open; renderList(); });
}
function probBar(f) {
  const s = (p, c, t) => `<span class="${c}" style="width:${(p * 100).toFixed(1)}%" title="${t} ${pp(p, 0)}">${p >= 0.16 ? pp(p, 0) : ""}</span>`;
  return `<div class="probbar" role="img" aria-label="fallend ${pp(f.p_bear)}, seitwärts ${pp(f.p_neutral)}, steigend ${pp(f.p_bull)}">${s(f.p_bear, "b", "fallend")}${s(f.p_neutral, "n", "seitwärts")}${s(f.p_bull, "u", "steigend")}</div>
    <div class="probmeta"><span>fallend</span><span>seitwärts</span><span>steigend</span></div>`;
}
function detail(f) {
  const b = D.backtest[f.horizon], m = (b.models[f.model] || {}), v = m.validation || {};
  const cur = (m.currency || {});
  const maxc = Math.max(...f.drivers.map((d) => Math.abs(d.contribution)), 0.01);
  const dirTxt = f.direction > 0 ? "leicht steigend" : f.direction < 0 ? "leicht fallend" : "keine klare Richtung";
  const er = f.expected_return === 0 ? `<b>0,00 %</b> <span class="faint">– keine verlässliche Renditeprognose (Out-of-Sample nicht besser als 0)</span>` : `<b>${pct(f.expected_return)}</b>`;
  const range = f.range_high == null ? `<span class="faint">Für den Tageshorizont folgt die Handelsspanne mit den Hoch-/Tiefkursen (Dukascopy).</span>`
    : `<b class="num">${pct(f.range_low)} … ${pct(f.range_high)}</b> <span class="faint">(typische Spanne der Schlusskurse bis zum Zieldatum)</span>`;
  return `<div class="fc-detail">
    <div class="grid-2">
      <div style="display:grid;gap:10px;min-width:0">
        <div class="label">Kurs der letzten 12 Monate und Prognosefächer</div>
        ${fanChart(f)}
        <div class="legend"><span><i style="background:var(--accent)"></i>Kurs</span><span><i style="background:color-mix(in srgb,var(--accent) 45%,transparent);height:8px"></i>80-%-Intervall</span><span><i style="background:color-mix(in srgb,var(--accent) 20%,transparent);height:8px"></i>90-%-Intervall</span></div>
      </div>
      <dl class="kv" style="align-content:start">
        <dt>Erwartete Richtung</dt><dd>${dirTxt}</dd>
        <dt>Erwartete Veränderung</dt><dd>${er}</dd>
        <dt>90-%-Intervall</dt><dd class="num">${pct(f.quantiles.q05)} … ${pct(f.quantiles.q95)}</dd>
        <dt>Handelsspanne</dt><dd>${range}</dd>
        <dt>Erwartete Schwankung (1σ)</dt><dd class="num">${pct(f.expected_vol, 2, false)}</dd>
        <dt>Seitwärts bedeutet</dt><dd class="num">± ${pct(f.expected_vol * 0.5, 2, false)}</dd>

function fanChart(f) {
  const series = (D.prices[f.pair] || []).map((r) => r[1]);
  const W = Math.max(320, Math.min(560, innerWidth - 64)), H = 190, padL = 46, padR = 54, padT = 10, padB = 22, n = series.length;
  const q = f.quantiles, p0 = f.price;
  const lv = (x) => p0 * Math.exp(x);
  const ext = [q.q05, q.q95].map(lv);
  const all = series.concat(ext);
  const mn = Math.min(...all), mx = Math.max(...all), pad = (mx - mn) * 0.06;
  const y = (v) => padT + (1 - (v - mn + pad) / (mx - mn + 2 * pad)) * (H - padT - padB);
  const plotW = W - padL - padR, xEnd = padL + plotW * 0.86, x = (i) => padL + i / (n - 1) * (xEnd - padL);
  const d = series.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + "," + y(v).toFixed(1)).join("");
  const xF = W - padR, yp = y(p0);
  const fan = (a, b) => `M${xEnd},${yp}L${xF},${y(lv(q[b])).toFixed(1)}L${xF},${y(lv(q[a])).toFixed(1)}Z`;
  const dec = f.pair.endsWith("JPY") ? 2 : 4;
  const ticks = [mn, (mn + mx) / 2, mx];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Kursverlauf ${pairName(f.pair)} mit Prognosefächer">
    ${ticks.map((t) => `<line x1="${padL}" x2="${W - padR}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line-soft)"/><text x="${padL - 6}" y="${y(t) + 4}" text-anchor="end">${fmt(t, dec)}</text>`).join("")}
    <path d="${fan("q05", "q95")}" fill="color-mix(in srgb,var(--accent) 20%,transparent)"/>
    <path d="${fan("q10", "q90")}" fill="color-mix(in srgb,var(--accent) 45%,transparent)"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>
    <circle cx="${xEnd}" cy="${yp}" r="3.2" fill="var(--accent)"/>
    <text x="${xF + 4}" y="${y(lv(q.q90)) + 4}">${fmt(lv(q.q90), dec)}</text>
    <text x="${xF + 4}" y="${y(lv(q.q10)) + 4}">${fmt(lv(q.q10), dec)}</text>
    <text x="${padL}" y="${H - 4}">${dateDe((D.prices[f.pair][0] || [])[0])}</text>
    ${xF - xEnd > 80 ? `<text x="${xEnd}" y="${H - 4}" text-anchor="middle">${dateDe(f.as_of)}</text>` : ""}
    <text x="${xF}" y="${H - 4}" text-anchor="end">${dateDe(f.target_date)}</text>
  </svg>`;
}

        <span>Teilperioden <span class="subs" aria-label="2000–08, 2009–15, ab 2016">${subs}</span></span>
        ${p ? `<span>Vorlauf ${p.lead_months} M: OOS-R² <b class="num">${pct((p.oos || {}).r2, 1)}</b></span>` : ""}</div>` : ""}
      <details><summary>Wirkungskette und Bedingungen</summary>
        <ol class="chain" style="margin-top:8px">${(d.chain || []).map((s) => `<li>${esc(s)}</li>`).join("")}</ol>

/* ---------- Daten ---------- */
function viewData() {
  const q = D.quality;
  const label = {gap: "Lücken", spike: "Verdacht auf Datenfehler", extreme_move: "Extreme Marktbewegungen (echt)", source_mismatch: "Abweichung FRED/EZB", stale: "Veraltete Daten", source_revision: "Nachträglich geänderte Werte"};

      <article class="panel"><div class="panel-head"><h2>Quellen</h2></div><div class="tbl-wrap"><table><thead><tr><th>Quelle</th><th>Letzter Abruf</th><th>Status</th></tr></thead><tbody>
        ${D.sources.map((s) => `<tr><td>${esc(s.source)}</td><td class="num">${s.last_run ? new Date(s.last_run).toLocaleString("de-DE", {dateStyle: "short", timeStyle: "short"}) : "–"}</td><td><span class="pill ${s.status === "ok" ? "good" : "bad"}">${esc(s.status)}</span></td></tr>`).join("")}</tbody></table></div></article>
      <article class="panel"><div class="panel-head"><h2>Datenqualität seit 1999</h2></div><div class="tbl-wrap"><table><thead><tr><th>Prüfung</th><th>Einstufung</th><th class="num">Anzahl</th></tr></thead><tbody>
        ${q.length ? q.map((r) => `<tr><td>${esc(label[r.check] || r.check)}</td><td><span class="pill ${r.severity === "info" ? "info" : r.severity === "warning" ? "warn" : "bad"}">${esc(r.severity)}</span></td><td class="num">${r.count}</td></tr>`).join("") : `<tr><td colspan="3" class="faint">Noch keine Prüfung gelaufen.</td></tr>`}</tbody></table></div></article>
    </div>
    <article class="panel"><div class="panel-head"><h2>Bekannte Grenzen</h2></div><ul class="plain">
      <li>Kurse sind vorläufig FRED-Mittagskurse (12:00 New York) und erscheinen nur wöchentlich. Marktübliche Schlusskurse um 17:00 New York mit Hoch/Tief (Dukascopy) folgen auf einem eigenen Server.</li>
      <li>Die Tagesprognose hat deshalb noch keine Handelsspanne.</li>
      <li>Zinsdifferenzen, Inflation und COT-Positionierung sind noch nicht angebunden (nächste Phase). Bisher nutzen die Modelle Kursdynamik, Schwankung und Risikostimmung.</li>
      <li>Milchpreise, Gold und die Industrieaktivität Chinas fehlen noch als Datenquellen.</li>
      <li>Rohstoffpreise von FRED sind meist Monatsdurchschnitte und erscheinen mit etwa 45 Tagen Verzögerung. Das System rechnet damit und nutzt keine Werte, die damals noch unbekannt waren.</li>
    </ul></article>
    <article class="panel"><div class="panel-head"><h2>Letzte Werte der Treiber</h2></div><div class="chips">${Object.entries(D.series_last).sort().map(([k, v]) => `<span class="chip">${esc(k)} <span class="num">${dateDe(v)}</span></span>`).join("")}</div></article>
  </section>`;
}

/* ---------- Fundamentale Seiten ---------- */
const F = () => D.fund;
const CCY = {USD: "US-Dollar", EUR: "Euro", JPY: "Yen", GBP: "Pfund", CHF: "Franken", CAD: "Kanadischer Dollar", AUD: "Australischer Dollar", NZD: "Neuseeland-Dollar"};
const IMPACT = {High: ["var(--red)", "Hoch (roter Ordner)"], Medium: ["var(--orange)", "Mittel"], Low: ["var(--yellow)", "Niedrig"], Holiday: ["var(--holiday)", "Feiertag"]};
const folder = (imp) => `<svg class="folder" viewBox="0 0 16 12" aria-label="${(IMPACT[imp] || IMPACT.Low)[1]}" role="img"><path d="M1 2.2C1 1.5 1.5 1 2.2 1h3.6l1.5 1.6h6.5c.7 0 1.2.5 1.2 1.2v6c0 .7-.5 1.2-1.2 1.2H2.2C1.5 11 1 10.5 1 9.8z" fill="${(IMPACT[imp] || IMPACT.Low)[0]}"/></svg>`;
const dirChip = (d) => `<span class="dir ${d > 0 ? "long" : d < 0 ? "short" : ""}">${d > 0 ? "LONG" : d < 0 ? "SHORT" : "NEUTRAL"}</span>`;
const dots = (k) => `<span class="cdots" aria-label="${k} von 3 Faktoren">${[0, 1, 2].map((i) => `<i class="${i < k ? "on" : ""}"></i>`).join("")}</span>`;
const bias = (score) => Math.round(50 + 50 * (score || 0));
const fmtK = (x) => x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "") + nf(1).format(Math.abs(x) / 1000) + "K";
const dayName = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("de-DE", {weekday: "long", day: "2-digit", month: "2-digit"});
const shortDay = (iso) => new Date(iso + "T12:00:00").toLocaleDateString("de-DE", {weekday: "short", day: "2-digit", month: "2-digit"});
const todayIso = () => new Date().toLocaleDateString("sv-SE", {timeZone: "Europe/Berlin"});
const nowIso = () => new Date().toISOString();
const valText = (v) => v == null ? "" : `${pp(v.hit_rate, 1)} Treffer (n = ${nf(0).format(v.n)})`;
const verdictOf = (v) => !v || v.hit_rate == null ? "noch nicht messbar" : (v.ci && v.ci[0] > 0.5) ? "kleiner, aber messbarer Vorteil" : "keine verlässliche Vorhersagekraft";
const INFO_ICON = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M8 7v4M8 4.6v.2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';

function nextHigh() { return (F().events || []).find((e) => e.impact === "High" && e.at >= nowIso()); }
function untilText(iso) {
  const ms = new Date(iso) - new Date(); if (ms < 0) return "läuft";
  const h = Math.floor(ms / 36e5), m = Math.floor(ms % 36e5 / 6e4);
  return h >= 24 ? `in ${Math.floor(h / 24)} T ${h % 24} h` : `in ${h} h ${m} min`;
}

function viewCockpit() {

        ${ev ? `Wichtigster Termin: <b class="y">${esc(CCY[ev.currency])} – ${esc(ev.title)}, ${shortDay(ev.day)} um ${ev.time}</b><sup class="ref"><a href="#quellen">[3]</a></sup>.` : "Diese Woche stehen keine roten Ordner mehr an."}
        ${bp ? `Stärkste Übereinstimmung: <b>${pairName(bp.pair)} ${bp.direction > 0 ? "long" : "short"}</b> (${bp.confluence}/3)<sup class="ref"><a href="#quellen">[4]</a></sup>${bp.day_range_pips ? `, typische Tagesbewegung ±${bp.day_range_pips} Pips` : ""}.` : ""}</p>
      <div style="display:grid;gap:4px">
        <div class="srcline"><span class="dot live"></span>COT · Bericht vom ${dateDe((f.cot[h.strong] || {}).report_date)}, veröffentlicht ${dateDe(((f.cot[h.strong] || {}).released || "").slice(0, 10))}</div>
        <div class="srcline"><span class="dot live"></span>Kalender · ${esc(D.meta.calendar_source)} · Stand ${new Date(D.meta.generated_at).toLocaleString("de-DE", {dateStyle: "short", timeStyle: "short"})}</div>
        <div class="srcline"><span class="dot live"></span>Kurse · bis ${dateDe(D.meta.as_of)}</div>
      </div>
    </div>
    <div class="tiles">
      <div class="panel tile"><span class="eyebrow"><b>[1]</b> ${h.strong}-Bias</span><span class="big num" style="color:var(--strong)">${bias(s.score)}</span><span class="faint" style="font-size:.8rem">von 100 · COT, Trend und Saison</span></div>

    </div>
    <div class="honest">${INFO_ICON}<span>Ehrlich geprüft: Mit genau diesen Regeln lag die Richtung bei voller Übereinstimmung (3/3) seit 2008 in ${c3 ? pp(c3.hit_rate, 0) : "–"} der Wochen richtig – <b>${verdictOf(c3)}</b>. Nutze die Faktoren als Überblick über die Fundamentaldaten, nicht als Signal. <a href="#paare">Details je Paar</a></span></div>
    <div class="grid-2">

        <li><span>[3]</span><span>${ev ? `${esc(D.meta.calendar_source)}-Kalender, Wichtigkeit hoch. Vorher: ${esc(ev.previous || "–")}, Prognose: ${esc(ev.forecast || "–")}.` : "–"}</span></li>
        <li><span>[4]</span><span>Regel: Mehrheit aus COT-Differenz (≥ ${f.rules.cot_diff} Punkte), Trend (≥ ${fmt(f.rules.trend_min, 1)} %) und Saison (≥ ${pp(f.rules.season_hit, 0)} der Jahre). Historisch 3/3: ${valText(c3)}. Tagesbewegung aus dem 80-%-Intervall der Tagesprognose.</span></li>

}
function evRow(e, withDay = true) {
  const past = e.at < nowIso();
  const wd = new Date(e.day + "T12:00:00").toLocaleDateString("de-DE", {weekday: "short"}).replace(".", "");
  return `<div class="ev ${past ? "past" : ""} ${withDay ? "" : "nodate"}"><span class="t">${withDay ? wd + " " : ""}${e.time}</span>${folder(e.impact)}<span class="c">${e.currency}</span><span>${esc(e.title)}</span>
    ${(e.forecast || e.previous || e.actual) ? `<span class="vals">${e.actual ? `<span>Ist ${esc(e.actual)}</span>` : ""}${e.forecast ? `<span>Prog. ${esc(e.forecast)}</span>` : ""}${e.previous ? `<span>Vorher ${esc(e.previous)}</span>` : ""}</span>` : ""}</div>`;
}
function pairRow(p) {
  const d = p.cot_diff;
  return `<a class="prow" href="#paar-${p.pair}"><span class="pair">${pairName(p.pair)}</span>${dirChip(p.direction)}<span class="val">${dots(p.confluence)} ${p.confluence}/3</span>
    <span class="val hide-s ${d > 0 ? "s" : d < 0 ? "w" : ""}">${d == null ? "–" : (d > 0 ? "+" : "") + fmt(d, 0)}</span><span class="val hide-s">${p.day_range_pips ? "±" + p.day_range_pips : "–"}</span></a>`;
}
function ccyBar(c) {
  const b = bias(c.score), col = b >= 50 ? "var(--strong)" : "var(--weak)";
  return `<div style="display:grid;grid-template-columns:46px minmax(0,1fr) 34px;gap:10px;align-items:center">
    <span class="ccy" style="font-family:var(--font-data);font-weight:600">${c.ccy}</span>
    <div class="meter" style="height:10px" role="img" aria-label="${c.ccy} Bias ${b}"><span class="z" style="left:50%;width:1px;background:var(--line)"></span><span style="position:absolute;top:0;bottom:0;border-radius:5px;background:${col};left:${Math.min(b, 50)}%;width:${Math.abs(b - 50)}%"></span></div>
    <span class="num" style="text-align:right">${b}</span></div>`;
}

  const today = todayIso();
  return `<section class="view">
    <div class="hero"><div class="eyebrow"><a href="#paare" style="color:inherit">Paare</a> · ${pairName(pair)} · KW ${f.week.kw}</div>
      <h1 style="font-size:clamp(2.3rem,9vw,4rem)">${pairName(pair)} diese Woche: ${verdict}.</h1>
      <p class="brief" style="font-size:1.15rem">${p.confluence}/3 Faktoren zeigen in diese Richtung${p.against.length ? `, ${p.against.length} dagegen` : ""}. ${p.week_range_pips ? `In 80 % der Wochen bewegte sich das Paar um weniger als <b>±${p.week_range_pips} Pips</b>, an einem Tag um weniger als <b>±${p.day_range_pips} Pips</b>.` : ""} ${p.high_events ? `<b class="y">${p.high_events} rote Ordner</b> betreffen ${b} oder ${q}.` : "Keine roten Ordner für dieses Paar."}</p>
      <div>${dirChip(p.direction)} <span class="val" style="margin-left:8px">${dots(p.confluence)} ${p.confluence}/3</span></div></div>
    <article class="panel"><h2 style="margin-bottom:6px">Die Woche Tag für Tag</h2>
      <div class="days">${p.days.map((d) => `<div class="daycard" ${d.date === today ? 'style="border-color:var(--accent)"' : ""}><span class="d">${esc(d.weekday)} · ${dateDe(d.date).slice(0, 5)}</span>
        ${d.events.length ? d.events.map((e) => `<div class="e">${folder(e.impact)}<span><span class="num faint">${e.time}</span> ${e.currency} ${esc(e.title)}</span></div>`).join("") : '<span class="faint" style="font-size:.84rem">keine wichtigen Termine</span>'}
        ${p.day_range_pips ? `<span class="faint num" style="font-size:.76rem">typisch ±${p.day_range_pips} Pips</span>` : ""}</div>`).join("")}</div>

        ${Object.entries(p.factors).map(([k, x]) => `<div class="factor"><span class="sig ${x.signal > 0 ? "up" : x.signal < 0 ? "down" : ""}">${x.signal > 0 ? "▲" : x.signal < 0 ? "▼" : "–"}</span>
          <span><b>${names[k]}</b> <span class="faint">· ${x.signal > 0 ? "spricht für " + b : x.signal < 0 ? "spricht für " + q : "neutral"}</span><br><span class="muted" style="font-size:.88rem">${esc(x.text)}</span></span></div>`).join("")}
      </article>
      <article class="panel"><h2 style="margin-bottom:8px">Kurs und Wochenfächer</h2>${w1 ? fanChart(w1) : '<p class="faint">Keine Wochenprognose.</p>'}
        <p class="faint" style="font-size:.8rem;margin-top:6px">Fächer = 80-/90-%-Intervall der validierten Wochenprognose. <a href="#prognosen">Zu den Prognosen</a></p></article>

    </div>
  </section>`;
}
function cotMini(c) {
  const x = F().cot[c]; if (!x) return `<div class="faint">${c}: keine COT-Daten</div>`;
  return `<div style="display:grid;gap:6px"><div style="display:flex;justify-content:space-between"><span class="num"><b>${c}</b> Commercials</span><span class="num">${fmt(x.comm_idx, 0)} · Spekulanten ${fmt(x.spec_idx, 0)}</span></div>${meter(x)}</div>`;
}
function meter(x) {
  const [lo, hi] = F().rules.cot_extreme;
  return `<div class="meter" role="img" aria-label="Commercials ${x.comm_idx}, Spekulanten ${x.spec_idx}">
    <span class="z" style="left:0;width:${lo}%"></span><span class="z" style="left:${hi}%;width:${100 - hi}%"></span>
    ${x.spec_idx != null ? `<span class="m" style="left:${x.spec_idx}%;background:var(--weak)"></span>` : ""}
    ${x.comm_idx != null ? `<span class="m" style="left:${x.comm_idx}%;background:var(--strong);width:4px"></span>` : ""}</div>
    <div class="mlabels"><span>0</span><span>${lo}</span><span>50</span><span>${hi}</span><span>100</span></div>`;
}
function seasonChart(st, curMonth) {
  if (!st) return '<p class="faint">Keine Daten.</p>';
  const months = ["J", "F", "M", "A", "M", "J", "J", "A", "S", "O", "N", "D"];
  const vals = months.map((_, i) => st[i + 1] || st[String(i + 1)] || null);
  const W = Math.max(300, Math.min(520, innerWidth - 64)), H = 170, pl = 34, pr = 6, pt = 18, pb = 22;
  const lim = Math.max(0.003, ...vals.map((v) => Math.abs(v ? v.mean : 0))) * 1.15;
  const bw = (W - pl - pr) / 12, y = (v) => pt + (1 - (v + lim) / (2 * lim)) * (H - pt - pb);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Durchschnittliche Monatsrendite">
    <line x1="${pl}" x2="${W - pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>
    <text x="${pl - 4}" y="${y(lim * 0.8) + 4}" text-anchor="end">${pct(lim * 0.8, 1)}</text><text x="${pl - 4}" y="${y(-lim * 0.8) + 4}" text-anchor="end">${pct(-lim * 0.8, 1)}</text>
    ${vals.map((v, i) => { if (!v) return ""; const x = pl + i * bw + bw * 0.18, top = Math.min(y(v.mean), y(0)), h = Math.max(1.5, Math.abs(y(v.mean) - y(0)));
      const col = v.mean >= 0 ? "var(--strong)" : "var(--weak)", cur = i + 1 === curMonth;
      return `<rect x="${x}" y="${top}" width="${bw * 0.64}" height="${h}" rx="2" fill="${col}" opacity="${cur ? 1 : 0.55}"><title>${months[i]}: Ø ${pct(v.mean, 2)}, ${pp(v.hit, 0)} der Jahre positiv (n = ${v.n})</title></rect>
        ${cur ? `<text x="${x + bw * 0.32}" y="${v.mean >= 0 ? top - 4 : top + h + 11}" text-anchor="middle" style="fill:var(--fg)">${pp(v.hit, 0)}</text>` : ""}`; }).join("")}
    ${months.map((m, i) => `<text x="${pl + i * bw + bw / 2}" y="${H - 6}" text-anchor="middle" ${i + 1 === curMonth ? 'style="fill:var(--fg);font-weight:600"' : ""}>${m}</text>`).join("")}
  </svg><p class="faint" style="font-size:.78rem;margin-top:4px">Ø Monatsrendite ${F().season.years[0]}–${F().season.years[1]}; Zahl über dem aktuellen Monat = Anteil positiver Jahre.</p>`;
}

function viewToday() {
  const f = F(), t = todayIso(), evs = f.events.filter((e) => e.day === t && e.impact !== "Low");

  const weekend = !f.week.days.includes(t);
  const affected = f.pairs.map((p) => ({...p, n: evs.filter((e) => p.pair.includes(e.currency)).length, nh: highs.filter((e) => p.pair.includes(e.currency)).length}))
    .filter((p) => p.n).sort((a, b) => b.nh - a.nh || b.n - a.n || (b.day_range_pips || 0) - (a.day_range_pips || 0));
  const next = evs.find((e) => e.at >= nowIso());
  const title = new Date(t + "T12:00:00").toLocaleDateString("de-DE", {weekday: "long", day: "numeric", month: "long"});
  return `<section class="view">
    <div class="hero"><div class="eyebrow">Tages-Update · ${esc(title)}</div>
      <h1 style="font-size:clamp(2.3rem,9vw,4.2rem)">${weekend ? "Heute ist Wochenende." : highs.length ? `Heute: ${highs.length} rote Ordner${ccys.length ? ` für ${ccys.slice(0, 3).join(", ")}` : ""}.` : "Heute: ein ruhiger Tag."}</h1>
      <p class="brief" style="font-size:1.12rem">${weekend ? "Die Wochenvorbereitung für die kommende Woche findest du im Cockpit." : `${evs.length} wichtige Termine${next ? `, als Nächstes <b class="y">${esc(next.currency)} ${esc(next.title)} um ${next.time}</b> (${untilText(next.at)})` : ", alle bereits vorbei"}. ${affected.length} Paare sind betroffen.`}</p></div>
    <article class="panel"><div class="section-title"><h2>Termine heute</h2><a href="#kalender" class="faint" style="font-size:.84rem">Ganze Woche</a></div>
      <div class="rows" style="margin-top:6px">${evs.length ? evs.map((e) => evRow(e, false)).join("") : '<p class="faint" style="padding:10px 0">Keine Termine mit mittlerer oder hoher Wichtigkeit.</p>'}</div></article>
    <article class="panel"><div class="section-title"><h2>Betroffene Paare</h2><span class="faint" style="font-size:.8rem">typische Tagesbewegung (80 %)</span></div>
      <div class="rows" style="margin-top:6px">${affected.length ? affected.map((p) => `<a class="prow" href="#paar-${p.pair}" style="grid-template-columns:minmax(84px,1fr) auto 64px 70px">
        <span class="pair">${pairName(p.pair)}</span>${dirChip(p.direction)}<span class="val">${p.nh ? `<span style="color:var(--red)">${p.nh}</span> rot` : `${p.n} Term.`}</span><span class="val">${p.day_range_pips ? "±" + p.day_range_pips : "–"}</span></a>`).join("") : '<p class="faint" style="padding:10px 0">Kein Paar mit wichtigen Terminen.</p>'}</div></article>
    <div class="honest">${INFO_ICON}<span>Die Tagesbewegung stammt aus dem 80-%-Intervall der validierten Tagesprognose: An 8 von 10 Tagen blieb die Kursänderung bis zum nächsten Tag innerhalb dieser Spanne. An Tagen mit roten Ordnern kann sie größer ausfallen.</span></div>
  </section>`;
}

/* ---------- Version 2: Matrix, Stärke, COT-Verlauf, Saison-Verlauf, Makro, Rechner ---------- */
const X = () => F().extra || {};
const csMap = () => Object.fromEntries(F().currencies.map((c) => [c.ccy, c]));
const marketPair = (a, b) => D.pairs.includes(a + b) ? a + b : b + a;
const heat = (v, max) => { const a = Math.min(1, Math.abs(v || 0) / max); return v == null ? "transparent" : `color-mix(in srgb, ${v >= 0 ? "var(--strong)" : "var(--weak)"} ${Math.round(12 + a * 70)}%, transparent)`; };
const segBtns = (key, opts, cur) => `<div class="seg" role="group">${opts.map(([v, l]) => `<button type="button" data-${key}="${v}" aria-pressed="${cur === v}">${l}</button>`).join("")}</div>`;
let ticker = null;

/* Paare: Matrix + Checkliste */
function viewPairs() {
  const f = F(), cs = csMap(), order = [...f.currencies].map((c) => c.ccy);
  const sel = state.selPair || (f.headline.best_pair || "EURUSD");
  const conf = f.validation.confluence || {};
  let rows = f.pairs.filter((p) => state.ccy === "ALLE" || p.pair.includes(state.ccy));
  rows = [...rows].sort((a, b) => b.confluence - a.confluence || Math.abs(b.cot_diff || 0) - Math.abs(a.cot_diff || 0));
  const cell = (b, q) => {
    if (b === q) return `<span class="mx-self">${b}</span>`;
    const d = bias(cs[b].score) - bias(cs[q].score), mp = marketPair(b, q), on = mp === sel;
    return `<button type="button" class="mx-cell ${on ? "on" : ""}" data-sel="${mp}" style="background:${heat(d, 40)}" aria-label="${b} gegen ${q}: ${d > 0 ? "+" : ""}${d}">${d > 0 ? "+" : ""}${d}</button>`;
  };
  return `<section class="view">
    <div class="hero"><div class="eyebrow">Paare · KW ${f.week.kw} · Wochenvorbereitung</div><h1 style="font-size:clamp(2.2rem,8vw,3.6rem)">Welche Paare passen diese Woche?</h1>
      <p class="brief" style="font-size:1.08rem">Die Matrix zeigt den Bias-Abstand jeder Währung (Zeile) gegen jede andere (Spalte). Blau = Zeilenwährung stärker, orange = schwächer. Tippe ein Feld an.</p></div>
    <div class="split">
      <article class="panel"><div class="section-title"><h2>Paar-Matrix</h2><span class="faint num" style="font-size:.74rem">Zeile = Basis · stark → schwach</span></div>
        <div class="mx-wrap"><div class="mx" style="grid-template-columns:54px repeat(${order.length},minmax(30px,1fr))">
          <span></span>${order.map((q) => `<span class="mx-h">${q}<small>${bias(cs[q].score)}</small></span>`).join("")}
          ${order.map((b) => `<span class="mx-r">${b}<small>COT ${fmt(cs[b].cot_idx, 0)}</small></span>${order.map((q) => cell(b, q)).join("")}`).join("")}
        </div></div></article>
      <article class="panel" id="check">${pairCheck(sel)}</article>
    </div>
    <div class="section-title"><h2>Alle 28 Paare</h2></div>
    <div class="chips" role="group" aria-label="Währung">${["ALLE", ...D.majors].map((c) => `<button type="button" data-ccy="${c}" aria-pressed="${state.ccy === c}">${c === "ALLE" ? "Alle 28" : c}</button>`).join("")}</div>
    <div class="rows"><div class="prow head"><span>Paar</span><span>Richtung</span><span>Konfluenz</span><span class="hide-s">COT-Diff.</span><span class="hide-s">Tag ±Pips</span></div>${rows.map(pairRow).join("")}</div>
    <div class="honest">${INFO_ICON}<span>Historische Trefferquote der Regel (Richtung der Folgewoche, seit 2008): 1/3 ${valText(conf[1] || conf["1"])} · 2/3 ${valText(conf[2] || conf["2"])} · 3/3 ${valText(conf[3] || conf["3"])}. Ergebnis: <b>${verdictOf(conf[3] || conf["3"])}</b>.</span></div>
  </section>`;
}
function pairCheck(pair) {
  const f = F(), p = f.pairs.find((x) => x.pair === pair), cs = csMap(); if (!p) return "";
  const b = pair.slice(0, 3), q = pair.slice(3), bb = bias(cs[b].score), bq = bias(cs[q].score), dist = bb - bq;
  const dir = p.direction || Math.sign(dist);
  const rank = [...f.pairs].sort((x, y) => y.confluence - x.confluence || Math.abs(y.cot_diff || 0) - Math.abs(x.cot_diff || 0)).findIndex((x) => x.pair === pair) + 1;
  const icon = (s) => s === "ok" ? '<span class="ck ok">✓</span>' : s === "no" ? '<span class="ck no">✕</span>' : s === "warn" ? '<span class="ck warn">!</span>' : '<span class="ck">–</span>';
  const st = (sig) => !sig ? "neutral" : sig === dir ? "ok" : "no";
  const names = {cot: "Positionierung (COT)", trend: "Trend (20 Tage)", season: `Saison (${f.season.month_name})`};
  const reds = p.days.flatMap((d) => d.events.filter((e) => e.impact === "High").map((e) => ({...e, wd: d.weekday})));
  const x = (v) => `${Math.max(0, Math.min(100, v))}%`;
  return `<div class="eyebrow">Prüfen · Rang ${rank} von 28</div>
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-top:6px"><h2 style="font-size:2rem;letter-spacing:-.03em">${pairName(pair)}</h2><div style="text-align:right">${dirChip(p.direction)}<div class="num" style="margin-top:6px">${dots(p.confluence)} ${p.confluence}/3</div></div></div>
    <div class="bdist"><div class="track"><span class="seg-fill" style="left:${x(Math.min(bb, bq))};width:${Math.abs(dist)}%"></span>
      <span class="pin" style="left:${x(bq)}"><b>${q} ${bq}</b></span><span class="pin top" style="left:${x(bb)}"><b>${b} ${bb}</b></span></div>
      <div class="mlabels"><span>0</span><span>Bias-Abstand ${dist > 0 ? "+" : ""}${dist} Punkte</span><span>100</span></div></div>
    <div class="label" style="margin:14px 0 4px">Konfluenz-Checkliste</div>
    <div class="checklist">
      <div class="ckrow">${icon(Math.abs(dist) >= 10 ? (Math.sign(dist) === dir ? "ok" : "no") : "neutral")}<div><b>Fundament (Bias)</b><span>${b} ${bb} gegen ${q} ${bq} · Abstand ${Math.abs(dist)} Punkte${Math.abs(dist) < 10 ? " · knapp" : ""}</span></div></div>
      ${Object.entries(p.factors).map(([k, v]) => `<div class="ckrow">${icon(st(v.signal))}<div><b>${names[k]}</b><span>${esc(v.text)}</span></div></div>`).join("")}
      ${(() => { const rc = R().currencies, cb = (rc[b] || {}).short, cq = (rc[q] || {}).short; if (!cb || !cq) return "";
        const cd = cb.value - cq.value; return `<div class="ckrow"><span class="ck">i</span><div><b>Zinsdifferenz (Carry)</b><span>${b} ${fmt(cb.value, 2)} % gegen ${q} ${fmt(cq.value, 2)} % · ${cd > 0 ? "+" : ""}${fmt(cd, 2)} Prozentpunkte – ${dir > 0 ? (cd > 0 ? "Long bringt eher Swap" : "Long kostet eher Swap") : dir < 0 ? (cd < 0 ? "Short bringt eher Swap" : "Short kostet eher Swap") : "nur zur Information"}</span></div></div>`; })()}
      <div class="ckrow">${icon(reds.length ? "warn" : "ok")}<div><b>Event-Lage</b><span>${reds.length ? reds.slice(0, 3).map((e) => `${e.wd.slice(0, 2)} ${e.time} ${e.currency} ${esc(e.title)}`).join(" · ") + (reds.length > 3 ? ` · +${reds.length - 3}` : "") : "keine roten Ordner für beide Währungen"}</span></div></div>
    </div>
    ${p.against.length ? `<div class="label" style="margin:12px 0 4px">Gegenargumente</div><p class="muted" style="font-size:.88rem">${p.against.map((k) => names[k]).join(", ")} ${p.against.length > 1 ? "sprechen" : "spricht"} gegen die Richtung.</p>` : ""}
    <p style="margin-top:12px"><a href="#paar-${pair}">Wochen- und Tagesansicht öffnen →</a></p>`;
}

function cotChart(x, yrs) {
  if (!x || !x.weekly) return '<p class="faint">Keine Daten.</p>';

  const W = Math.max(320, Math.min(980, ($("#app").clientWidth || 360) - 40)), H = W < 500 ? 230 : 300, pl = 8, pr = 64, pt = 10, pb = 24;
  const vals = rows.flatMap((r) => [r[1], r[2], r[3]]).filter((v) => v != null), lim = Math.max(...vals.map(Math.abs)) * 1.1;
  const n = rows.length, xs = (i) => pl + i / (n - 1) * (W - pl - pr), ys = (v) => pt + (1 - (v + lim) / (2 * lim)) * (H - pt - pb);
  const step = (k) => rows.map((r, i) => r[k] == null ? "" : `${i ? "H" + xs(i).toFixed(1) + "V" : "M" + xs(i).toFixed(1) + ","}${ys(r[k]).toFixed(1)}`).join("");
  const bands = hist.map((h, i) => (h[1] >= 80 || h[1] <= 20) && i < n - 1 ? `<rect x="${xs(i)}" y="${pt}" width="${xs(i + 1) - xs(i) + .5}" height="${H - pt - pb}" fill="color-mix(in srgb,var(--yellow) 13%,transparent)"/>` : "").join("");
  const ticks = [-lim * 0.66, -lim * 0.33, 0, lim * 0.33, lim * 0.66];
  const months = rows.map((r, i) => [r[0], i]).filter(([d], i) => i === 0 || d.slice(5, 7) !== rows[i - 1][0].slice(5, 7)).filter(([d]) => ["01", "04", "07", "10"].includes(d.slice(5, 7)));
  const last = rows[n - 1], lab = (v, col) => v == null ? "" : `<rect x="${W - pr + 4}" y="${ys(v) - 9}" width="${pr - 6}" height="18" rx="4" fill="${col}"/><text x="${W - pr + 4 + (pr - 6) / 2}" y="${ys(v) + 4}" text-anchor="middle" style="fill:var(--accent-ink);font-weight:600">${fmtK(v)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="COT Netto-Positionen">${bands}
    ${ticks.map((t) => `<line x1="${pl}" x2="${W - pr}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--line-soft)"/>`).join("")}
    <line x1="${pl}" x2="${W - pr}" y1="${ys(0)}" y2="${ys(0)}" stroke="var(--fg-3)"/>
    <path d="${step(3)}" fill="none" stroke="var(--pink)" stroke-width="1.4" opacity=".85"/><path d="${step(2)}" fill="none" stroke="var(--weak)" stroke-width="1.6"/><path d="${step(1)}" fill="none" stroke="var(--strong)" stroke-width="2.2"/>
    ${months.map(([d, i]) => `<text x="${xs(i)}" y="${H - 6}" text-anchor="middle">${["Jan", "Apr", "Jul", "Okt"][["01", "04", "07", "10"].indexOf(d.slice(5, 7))]} ${d.slice(2, 4)}</text>`).join("")}
    ${lab(last[3], "var(--pink)")}${lab(last[2], "var(--weak)")}${lab(last[1], "var(--strong)")}
    <text x="${pl + 4}" y="${pt + 12}">netto long</text><text x="${pl + 4}" y="${H - pb - 6}">netto short</text></svg>`;
}

function quadrant(cs) {
  const W = 380, H = 360, p = 10, inner = 50, tr = cs.map((c) => c.trend_pct || 0), lim = Math.max(1, ...tr.map(Math.abs)) * 1.1;
  const xs = (v) => p + inner + (v + lim) / (2 * lim) * (W - 2 * (p + inner)), ys = (v) => p + inner + (1 - v / 100) * (H - 2 * (p + inner));
  const pts = cs.filter((c) => c.cot_idx != null).map((c) => ({c, x: xs(c.trend_pct || 0), y: ys(c.cot_idx)}));
  for (let k = 0; k < 40; k++) for (let a = 0; a < pts.length; a++) for (let b = a + 1; b < pts.length; b++) {
    const dx = pts[b].x - pts[a].x, dy = pts[b].y - pts[a].y, d = Math.hypot(dx, dy) || 0.01;
    if (d < 32) { const m = (32 - d) / 2, ux = dx / d, uy = dy / d; pts[a].x -= ux * m; pts[a].y -= uy * m; pts[b].x += ux * m; pts[b].y += uy * m; }
  }
  pts.forEach((q) => { q.x = Math.max(p + 16, Math.min(W - p - 16, q.x)); q.y = Math.max(p + 16, Math.min(H - p - 16, q.y)); });
  const lab = (x, y, a, t, s2) => `<text x="${x}" y="${y}" text-anchor="${a}" style="fill:var(--fg-2);font-weight:600;font-size:10.5px">${t}</text><text x="${x}" y="${y + 12}" text-anchor="${a}" style="font-size:9.5px">${s2}</text>`;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Quadrant Trend gegen Positionierung" style="max-width:560px">

    <line x1="${W / 2}" x2="${W / 2}" y1="${p}" y2="${H - p}" stroke="var(--line)"/><line x1="${p}" x2="${W - p}" y1="${H / 2}" y2="${H / 2}" stroke="var(--line)"/>
    ${lab(W - p - 6, p + 14, "end", "Rückenwind", "steigt · Commercials long")}${lab(p + 6, p + 14, "start", "Absicherer kaufen", "fällt · Commercials long")}
    ${lab(W - p - 6, H - p - 18, "end", "Ohne Absicherer", "steigt · Commercials short")}${lab(p + 6, H - p - 18, "start", "Gegenwind", "fällt · Commercials short")}
    <text x="${W - p - 4}" y="${H / 2 - 5}" text-anchor="end" style="font-size:9.5px">Trend 20 T →</text><text x="${W / 2 + 5}" y="${p + 50}" style="font-size:9.5px">COT-Index ↑</text>
    ${pts.map(({c, x, y}) => `<g><circle cx="${x}" cy="${y}" r="15" fill="var(--surface)" stroke="${bias(c.score) >= 50 ? "var(--strong)" : "var(--weak)"}" stroke-width="2"/><text x="${x}" y="${y + 4}" text-anchor="middle" style="fill:var(--fg);font-weight:700;font-size:10px">${c.ccy}</text></g>`).join("")}</svg>`;
}
function heatmap(cs) {
  const cols = [["Bias", (c) => bias(c.score) - 50, 40], ["COT", (c) => c.cot_idx == null ? null : c.cot_idx - 50, 50], ["Trend", (c) => c.trend_pct, 2], ["Saison", (c) => c.season_hit == null ? null : (c.season_hit - 0.5) * 100, 30]];
  const txt = (k, c) => k === "Bias" ? bias(c.score) : k === "COT" ? fmt(c.cot_idx, 0) : k === "Trend" ? (c.trend_pct > 0 ? "+" : "") + fmt(c.trend_pct, 1) : c.season_hit == null ? "–" : pp(c.season_hit, 0);
  return `<div class="hm" style="grid-template-columns:48px repeat(${cols.length},minmax(0,1fr))"><span></span>${cols.map(([k]) => `<span class="hm-h">${k}</span>`).join("")}
    ${cs.map((c) => `<span class="mx-r">${c.ccy}</span>${cols.map(([k, fn, m]) => `<span class="hm-c" style="background:${heat(fn(c), m)}">${txt(k, c)}</span>`).join("")}`).join("")}</div>
    <p class="faint" style="font-size:.76rem;margin-top:8px">Bias und COT als Abstand zur Mitte (50), Trend in %, Saison = Anteil positiver Jahre im ${esc(F().season.month_name)}.</p>`;
}

        <label class="fld"><span>Stop-Loss (Pips)</span><input id="c-sl" type="number" inputmode="decimal" min="0" step="1" value="${s.sl}"></label>
        <label class="fld"><span>Ziel (Pips)</span><input id="c-tp" type="number" inputmode="decimal" min="0" step="1" value="${s.tp}"></label>
      </article>
      <article class="panel" id="c-out"></article>
    </div>
    <p class="faint" style="font-size:.8rem">Umrechnung mit den letzten Kursen (${dateDe(D.meta.as_of)}). Pip = 0,0001 (JPY-Paare 0,01), Standard-Lot = 100.000 Einheiten. Dein Broker kann leicht abweichen.</p>
  </section>`;
}
function bindCalc() {
  const ids = ["pair", "acct", "size", "risk", "sl", "tp"], u = usdPer();
  const calc = () => {
    const v = Object.fromEntries(ids.map((k) => [k, $("#c-" + k).value]));
    state.calc = {...v, size: +v.size, risk: +v.risk, sl: +v.sl, tp: +v.tp};
    const p = v.pair, q = p.slice(3), pip = p.endsWith("JPY") ? 0.01 : 0.0001;
    const pipVal = pip * 100000 * (u[q] / u[v.acct]);
    const riskAmt = state.calc.size * state.calc.risk / 100, lots = state.calc.sl > 0 ? riskAmt / (state.calc.sl * pipVal) : 0;
    const d1 = F().pairs.find((x) => x.pair === p) || {}, crv = state.calc.sl ? state.calc.tp / state.calc.sl : 0;
    const money = (x) => isFinite(x) ? nf(2).format(x) + " " + v.acct : "–";
    $("#c-out").innerHTML = `<div class="bigstat" style="grid-template-columns:repeat(2,minmax(0,1fr))">
      <div class="tile"><span class="eyebrow">Positionsgröße</span><span class="big num" style="color:var(--accent)">${fmt(lots, 2)}</span><span class="faint" style="font-size:.8rem">Lots · ${nf(0).format(lots * 100000)} Einheiten</span></div>
      <div class="tile"><span class="eyebrow">Risiko</span><span class="big num">${money(riskAmt)}</span><span class="faint" style="font-size:.8rem">${fmt(state.calc.risk, 1)} % des Kontos</span></div></div>
      <dl class="kv" style="margin-top:14px"><dt>Pip-Wert je Standard-Lot</dt><dd class="num">${money(pipVal)}</dd><dt>Möglicher Gewinn am Ziel</dt><dd class="num">${money(lots * state.calc.tp * pipVal)}</dd>
        <dt>Chance-Risiko-Verhältnis</dt><dd class="num">1 : ${fmt(crv, 2)}</dd><dt>Typische Tagesbewegung ${pairName(p)}</dt><dd class="num">±${d1.day_range_pips ?? "–"} Pips</dd><dt>Typische Wochenbewegung</dt><dd class="num">±${d1.week_range_pips ?? "–"} Pips</dd></dl>
      ${d1.day_range_pips && state.calc.sl < d1.day_range_pips * 0.5 ? `<div class="honest" style="margin-top:12px">${INFO_ICON}<span>Dein Stop (${state.calc.sl} Pips) ist kleiner als die Hälfte der typischen Tagesbewegung (±${d1.day_range_pips}). Er wird dadurch leicht vom normalen Rauschen ausgelöst.</span></div>` : ""}`;
  };
  ids.forEach((k) => $("#c-" + k).addEventListener("input", calc)); calc();
}

/* Kalender mit Countdown */
function viewCalendarV2() {
  const ev = nextHigh();
  const card = ev ? `<article class="panel nextcard"><div class="nc-ico">${folder("High")}</div><div style="min-width:0"><div class="eyebrow">Nächster wichtiger Termin</div>
      <h2 style="margin:4px 0">${esc(ev.currency)} · ${esc(ev.title)}</h2><span class="faint num" style="font-size:.82rem">${shortDay(ev.day)} · ${ev.time} · Prog. ${esc(ev.forecast || "–")} · Vorher ${esc(ev.previous || "–")}</span></div>
      <div class="nc-cd"><span class="eyebrow">verbleibt</span><b class="num" id="countdown" data-at="${ev.at}">–</b></div></article>` : "";
  return viewCalendar().replace('<div class="toolbar">', card + '<div class="toolbar">');
}
function startTicker() {
  clearInterval(ticker); const el = $("#countdown"); if (!el) return;
  const tick = () => { const ms = new Date(el.dataset.at) - new Date(); if (ms <= 0) { el.textContent = "jetzt"; return; } const s = Math.floor(ms / 1000);
    el.textContent = `${String(Math.floor(s / 3600)).padStart(2, "0")}:${String(Math.floor(s % 3600 / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; };
  tick(); ticker = setInterval(tick, 1000);
}
function bindCalendarV2() { bindCalendar(); startTicker(); }

/* Zinsen & Notenbanken */
const R = () => (X().rates || {currencies: {}, carry: {}});
const bp = (x) => x == null ? "–" : (x > 0 ? "+" : x < 0 ? "−" : "±") + nf(0).format(Math.abs(x * 100)) + " bp";
function viewRates() {
  const r = R().currencies, sel = state.rateSel || "USD", e = r[sel] || {};
  const order = [...D.majors].sort((a, b) => ((r[b] || {}).short || {}).value - ((r[a] || {}).short || {}).value);
  const tile = (lab, val, sub, cls = "") => `<div class="panel tile"><span class="eyebrow">${lab}</span><span class="big num ${cls}" style="font-size:2.1rem">${val}</span><span class="faint" style="font-size:.78rem">${sub}</span></div>`;
  const inf = e.inflation;
  const lastWithStale = Object.values(r).filter((x) => x.inflation && x.inflation.stale).length;
  return `<section class="view">
    <div class="hero"><div class="eyebrow">Makro · Zinsen & Notenbanken</div><h1 style="font-size:clamp(2.2rem,8vw,3.6rem)">Zinsen & Notenbanken</h1>
      <p class="brief" style="font-size:1.05rem">Zinsniveau, Zinsrichtung und Renditen der acht Währungsräume. Zinsunterschiede bestimmen, was es kostet oder bringt, ein Paar zu halten (Carry).</p></div>
    <div class="chips" role="group" aria-label="Währung">${D.majors.map((c) => `<button type="button" data-rate="${c}" aria-pressed="${sel === c}">${c}</button>`).join("")}</div>
    <article class="panel"><div class="section-title"><h2>${sel} · ${esc(e.bank || "")}</h2><span class="chip"><span class="dot live"></span>Stand ${e.short ? dateDe(e.short.date) : "–"}</span></div>
      <div class="bigstat four" style="margin-top:12px">
        ${tile("Kurzfristzins", e.short ? fmt(e.short.value, 2) + " %" : "–", e.short ? `12 Monate ${bp(e.short.chg_12m)} · 3 Monate ${bp(e.short.chg_3m)}` : "")}
        ${tile("Inflation J/J", inf ? fmt(inf.value, 1) + " %" : "–", inf ? (inf.stale ? `<span style="color:var(--yellow)">veraltet · Stand ${inf.date}</span>` : `Stand ${inf.date}`) : "keine Quelle", inf && inf.stale ? "faint" : "")}
        ${tile("10J-Rendite", e.y10 ? fmt(e.y10.value, 2) + " %" : "–", e.y10 ? `12 Monate ${bp(e.y10.chg_12m)}` : "")}
        ${tile("Zinskurve 10J − kurz", e.curve == null ? "–" : (e.curve > 0 ? "+" : "") + fmt(e.curve, 2), e.curve == null ? "" : e.curve >= 0 ? "normal (steigend)" : "invers – oft Signal für erwartete Zinssenkungen", e.curve < 0 ? "y" : "")}
      </div>
      <div class="label" style="margin:14px 0 6px">Verlauf 5 Jahre</div>${rateChart(e)}
      <div class="legend-s" style="margin-top:6px"><span><i style="background:var(--accent)"></i>Kurzfristzins</span><span><i style="background:var(--weak)"></i>10J-Rendite</span></div>
      <p class="faint" style="font-size:.76rem;margin-top:6px">${esc((e.short || {}).source ? e.short.source.description : "")} · ${esc((e.y10 || {}).source ? e.y10.source.description : "")}</p></article>
    <article class="panel"><h2 style="margin-bottom:6px">Alle Notenbanken</h2><div class="tbl-wrap"><table><thead><tr><th>Währung</th><th class="hide-s">Notenbank</th><th class="num">Zins</th><th class="num">12 M</th><th class="num">10J</th><th class="num">Kurve</th><th class="num">Inflation</th><th class="num">Realzins</th></tr></thead><tbody>
      ${order.map((c) => { const x = r[c] || {}; const ch = (x.short || {}).chg_12m;
        return `<tr><td><b class="num">${c}</b></td><td class="faint hide-s">${esc(x.bank)}</td><td class="num">${x.short ? fmt(x.short.value, 2) + " %" : "–"}</td>
          <td class="num" style="color:${ch > 0.05 ? "var(--strong)" : ch < -0.05 ? "var(--weak)" : "var(--fg-3)"}">${ch > 0.05 ? "▲" : ch < -0.05 ? "▼" : "■"} ${bp(ch)}</td>
          <td class="num">${x.y10 ? fmt(x.y10.value, 2) + " %" : "–"}</td><td class="num">${x.curve == null ? "–" : (x.curve > 0 ? "+" : "") + fmt(x.curve, 2)}</td>
          <td class="num">${x.inflation ? (x.inflation.stale ? `<span class="faint">${fmt(x.inflation.value, 1)} % (${x.inflation.date})</span>` : fmt(x.inflation.value, 1) + " %") : "–"}</td>
          <td class="num">${x.real == null ? "–" : (x.real > 0 ? "+" : "") + fmt(x.real, 2) + " %"}</td></tr>`; }).join("")}</tbody></table></div>
      ${lastWithStale ? `<div class="honest" style="margin-top:12px">${INFO_ICON}<span>Für ${lastWithStale} Länder liefert die bisherige Quelle (OECD über FRED) keine aktuellen Inflationszahlen mehr. Sie sind grau markiert und fließen in keinen Realzins ein. Aktuelle Werte von den nationalen Statistikämtern folgen.</span></div>` : ""}</article>
    <article class="panel"><div class="section-title"><h2>Zinsdifferenz-Matrix</h2><span class="faint num" style="font-size:.74rem">Zeile minus Spalte · Prozentpunkte</span></div>${carryMatrix(order)}
      <p class="faint" style="font-size:.78rem;margin-top:8px">Positiv: Die Zeilenwährung bringt mehr Zins. Wer sie gegen die Spaltenwährung kauft, erhält meist Swap (Carry). Der genaue Swap hängt vom Broker ab.</p></article>
  </section>`;
}
function rateChart(e) {
  const a = (e.short || {}).history || [], b = (e.y10 || {}).history || [];
  if (a.length < 2) return '<p class="faint">Keine Daten.</p>';
  const W = Math.max(320, Math.min(980, ($("#app").clientWidth || 360) - 40)), H = 200, pl = 40, pr = 10, pt = 10, pb = 22;
  const all = a.concat(b).map((r) => r[1]).filter((v) => v != null), mn = Math.min(0, ...all), mx = Math.max(...all) * 1.08;
  const n = Math.max(a.length, b.length), xs = (i, len) => pl + (i + (n - len)) / (n - 1) * (W - pl - pr), ys = (v) => pt + (1 - (v - mn) / (mx - mn)) * (H - pt - pb);
  const path = (h) => h.map((r, i) => `${i ? "L" : "M"}${xs(i, h.length).toFixed(1)},${ys(r[1]).toFixed(1)}`).join("");
  const ticks = [mn, (mn + mx) / 2, mx];
  const yrs = a.filter((r, i) => r[0].endsWith("-01")).map((r) => [r[0].slice(0, 4), a.indexOf(r)]);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Zinsverlauf">
    ${ticks.map((t) => `<line x1="${pl}" x2="${W - pr}" y1="${ys(t)}" y2="${ys(t)}" stroke="var(--line-soft)"/><text x="${pl - 6}" y="${ys(t) + 4}" text-anchor="end">${fmt(t, 1)} %</text>`).join("")}
    ${mn < 0 ? `<line x1="${pl}" x2="${W - pr}" y1="${ys(0)}" y2="${ys(0)}" stroke="var(--fg-3)"/>` : ""}
    <path d="${path(b)}" fill="none" stroke="var(--weak)" stroke-width="1.6"/><path d="${path(a)}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>
    ${yrs.map(([y, i]) => `<text x="${xs(i, a.length)}" y="${H - 6}" text-anchor="middle">${y}</text>`).join("")}</svg>`;
}
function carryMatrix(order) {
  const r = R().currencies, v = (c) => ((r[c] || {}).short || {}).value;
  return `<div class="mx-wrap"><div class="mx flat" style="grid-template-columns:54px repeat(${order.length},minmax(34px,1fr))"><span></span>${order.map((q) => `<span class="mx-h">${q}<small>${fmt(v(q), 2)}</small></span>`).join("")}
    ${order.map((b) => `<span class="mx-r">${b}</span>${order.map((q) => b === q ? `<span class="mx-self">${b}</span>` : (() => { const d = v(b) - v(q);
      return `<a class="mx-cell" href="#paar-${marketPair(b, q)}" style="background:${heat(d, 4)};text-decoration:none" aria-label="${b} minus ${q}: ${fmt(d, 2)}">${d > 0 ? "+" : ""}${fmt(d, 1)}</a>`; })()).join("")}`).join("")}</div></div>`;
}
function bindRates() { document.querySelectorAll("[data-rate]").forEach((b) => b.onclick = () => { state.rateSel = b.dataset.rate; route(); }); }

function renderDrawer(cur) {
  const ev = nextHigh();
  $("#drawer").innerHTML = `<div class="drawer-head"><span style="display:flex;flex-direction:column;gap:2px"><b style="font-family:var(--font-display);font-size:1.1rem;letter-spacing:-.02em">Worl<span style="display:inline-block;transform:scaleX(-1);color:var(--accent)">D</span><span style="color:var(--accent)">D</span>river</b><span class="eyebrow">KW ${F().week.kw} · ${new Date().toLocaleDateString("de-DE", {weekday: "short", day: "2-digit", month: "2-digit"})}</span></span><button class="iconbtn" type="button" id="close-btn" aria-label="Menü schließen">

function renderStatus() {
  const vix = D.meta.vix, reg = regimeOf(vix), pending = D.promotions.filter((p) => p.needs_confirmation).length;
  const el = $("#status"); if (!el) return;

    <span class="chip"><span class="dot ${reg === "Stress" ? "bad" : reg === "normal" ? "warn" : "good"}"></span>VIX ${fmt(vix, 1)} · ${reg}</span>
    ${pending ? `<span class="chip"><span class="dot warn"></span>${pending} Freigaben offen</span>` : ""}`;
}

/* ---------- Routing ---------- */
let curView = "cockpit";
const VIEWS = {
  cockpit: ["Wochenvorbereitung", viewCockpit, () => {}], heute: ["Tages-Update", viewToday, () => {}], waehrungen: ["Währungen", viewCurrencies, bindCurrencies], paare: ["Paare", viewPairs, bindPairs],
  kalender: ["Kalender", viewCalendarV2, bindCalendarV2], cot: ["Positionierung", viewCot, bindCot], saisonalitaet: ["Saisonalität", viewSeason, bindSeason],
  prognosen: ["Prognosen", viewForecasts, bindForecasts], tracker: ["Forecast-Tracker", viewTracker, bindTracker],
  makro: ["Makro", viewMakro, bindMakro], rechner: ["Rechner", viewCalc, bindCalc], zinsen: ["Zinsen & Notenbanken", viewRates, bindRates], weltkarte: ["Weltkarte", viewMap, bindMap], daten: ["Daten", viewData, () => {}]};
function route() {
  clearInterval(ticker);
  const name = (location.hash || "#cockpit").slice(1);
  if (name.startsWith("paar-")) {
    curView = "paare"; $("#top-title").textContent = pairName(name.slice(5)); $("#app").innerHTML = viewPair(name.slice(5));
  } else {
    curView = VIEWS[name] ? name : "cockpit";
    const [title, view, bind] = VIEWS[curView];
    $("#top-title").textContent = title; $("#app").innerHTML = view(); bind();
  }
  document.title = `${$("#top-title").textContent} · WorlᗡDriver`;
  closeDrawer(); renderDrawer(curView);
}
if (!D) { document.getElementById("app").innerHTML = '<div class="empty"><b>Keine Daten eingebettet.</b><span>Die Seite wird mit „python -m forex_nexus build-site“ erzeugt.</span></div>'; }
else {
  renderChrome(); renderDrawer("cockpit"); route();
  $("#menu-btn").onclick = openDrawer; $("#scrim").onclick = closeDrawer;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
  window.addEventListener("hashchange", () => { state.open = null; route(); window.scrollTo(0, 0); });
}
