<title>WorlᗡDriver</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="WorlᗡDriver – geprüfte Signale und Signal-Abstimmung für die 28 Paare der 8 Hauptwährungen">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Aufbau: Kopfleiste mit Menü, eine ruhige Spalte bis 1000px. Jede Seite beantwortet eine Frage:
   Übersicht „Wohin zeigen die Signale?“, Paar „Warum?“, Prüfung „Kann ich dem trauen?“. */
:root{
  color-scheme:dark;
  --bg:#0c0e13;--surface:#13161d;--surface-2:#1a1e27;--line:#272c38;--line-soft:#1d212b;
  --fg:#eef0f4;--fg-2:#a7adbb;--fg-3:#767d8e;--accent:#7b93ff;
  --bull:#4fb3a4;--bear:#ef8d4f;--neutral:#5b6070;--good:#3fb97e;--warn:#e2b43c;--bad:#e5484d;--red:#e5484d;--orange:#f0913a;
  --font-display:"Inter Tight","Inter",ui-sans-serif,system-ui,sans-serif;
  --font-body:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-data:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;--r:14px;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  color-scheme:light;--bg:#f6f7f9;--surface:#fff;--surface-2:#eef0f4;--line:#d9dde6;--line-soft:#e7eaf0;
  --fg:#12141a;--fg-2:#4a5162;--fg-3:#6f7687;--accent:#4a5fe0;--bull:#17806f;--bear:#c25a1a;--neutral:#b4b9c4;
  --good:#1f8a50;--warn:#a87508;--bad:#c23a24;--red:#d1343a;--orange:#d9761e}}
:root[data-theme="light"]{
  color-scheme:light;--bg:#f6f7f9;--surface:#fff;--surface-2:#eef0f4;--line:#d9dde6;--line-soft:#e7eaf0;
  --fg:#12141a;--fg-2:#4a5162;--fg-3:#6f7687;--accent:#4a5fe0;--bull:#17806f;--bear:#c25a1a;--neutral:#b4b9c4;
  --good:#1f8a50;--warn:#a87508;--bad:#c23a24;--red:#d1343a;--orange:#d9761e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{font-family:var(--font-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(1.9rem,7vw,2.8rem);font-weight:800;letter-spacing:-.03em;line-height:1.08}
h2{font-size:1.15rem} h3{font-size:1rem}
p{margin:0}
.num{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.muted{color:var(--fg-2)} .faint{color:var(--fg-3)} .small{font-size:.82rem}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line-soft);padding-top:env(safe-area-inset-top,0px)}
.top-row{display:flex;align-items:center;gap:12px;padding-block:10px}
.iconbtn{all:unset;cursor:pointer;display:inline-grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:12px;flex:none}
.top-title{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand{font-family:var(--font-display);font-weight:800;font-size:1.1rem;text-decoration:none;color:var(--fg);letter-spacing:-.02em}
.brand i{font-style:normal;color:var(--accent)} .brand i.m{display:inline-block;transform:scaleX(-1)}
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .45);z-index:40}
aside.drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,86vw);z-index:50;background:var(--surface);border-right:1px solid var(--line);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 16px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;overflow-y:auto;transform:translateX(-102%);transition:transform .2s}
aside.drawer.open{transform:none}
@media (prefers-reduced-motion:reduce){aside.drawer{transition:none}}
.drawer nav{display:grid;gap:2px}
.drawer nav a{text-decoration:none;color:var(--fg);padding:10px 12px;border-radius:10px}
.drawer nav a[aria-current="page"]{background:var(--surface-2)}
@media (min-width:1100px){
  aside.drawer{transform:none;width:240px;z-index:25}
  #menu-btn,#close-btn{display:none} .scrim{display:none!important}
  header.top,main,footer{margin-left:240px}
}
main{padding-block:20px 48px}
section.view{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
section.view>*{min-width:0}
.lede{display:grid;gap:8px} .lede p{color:var(--fg-2);max-width:68ch}
.panel{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);padding:16px;display:grid;gap:12px;min-width:0}
.panel-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:720px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.honest{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;border:1px solid color-mix(in srgb,var(--warn) 40%,transparent);background:color-mix(in srgb,var(--warn) 8%,transparent);border-radius:12px;padding:12px 14px;font-size:.9rem}
.honest b{color:var(--fg)} .honest svg{color:var(--warn);margin-top:2px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.seg button{all:unset;cursor:pointer;padding:6px 14px;border-radius:7px;font-size:.88rem;color:var(--fg-2);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0 / .25)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
select,input{background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;font:inherit;font-size:.9rem;min-width:0}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:600;white-space:nowrap;border:1px solid var(--line);color:var(--fg-2)}
.pill.long{color:var(--bull);border-color:color-mix(in srgb,var(--bull) 50%,transparent);background:color-mix(in srgb,var(--bull) 12%,transparent)}
.pill.short{color:var(--bear);border-color:color-mix(in srgb,var(--bear) 50%,transparent);background:color-mix(in srgb,var(--bear) 12%,transparent)}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 50%,transparent)}
.pill.bad{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 50%,transparent)}
.votebar{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--surface-2)}
.votebar i{display:block;height:100%} .votebar .u{background:var(--bull)} .votebar .n{background:var(--neutral)} .votebar .d{background:var(--bear)}
.rows{display:grid;gap:8px}
a.row{display:grid;grid-template-columns:86px minmax(0,1fr) 120px 92px;gap:14px;align-items:center;text-decoration:none;color:var(--fg);background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;padding:12px 14px}
a.row:hover{background:var(--surface-2)}
.row .pair{font-family:var(--font-display);font-weight:700;font-size:1.02rem}
.row .meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.76rem;color:var(--fg-3);margin-top:5px}
.row .rng{text-align:right;font-size:.84rem}
@media (max-width:720px){a.row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"p l" "b b" "r r";row-gap:8px}
  .row .c-p{grid-area:p} .row .c-b{grid-area:b} .row .c-r{grid-area:r} .row .c-l{grid-area:l} .row .rng{text-align:left}}
.big{font-family:var(--font-display);font-weight:800;font-size:2.4rem;line-height:1;letter-spacing:-.03em}
.sig{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line-soft)}
.fam+.sig{border-top:0}
.sig .rec{grid-column:1/-1;font-size:.78rem;color:var(--fg-3)}
.sig>.pill{align-self:start}
.fam{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3);font-weight:600;margin-top:10px}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;font-size:.9rem;margin:0}
.kv dt{color:var(--fg-2)} .kv dd{margin:0;text-align:right}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.84rem}
th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line-soft);white-space:nowrap}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);z-index:1}
th{font-weight:600;color:var(--fg-3);font-size:.72rem;text-transform:uppercase;letter-spacing:.05em}
td.cell{font-family:var(--font-data)}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:720px){.kpis{grid-template-columns:minmax(0,1fr)}}
.kpi{gap:2px} .kpi b{font-family:var(--font-display);font-size:1.5rem}
.ev{display:grid;grid-template-columns:52px 40px minmax(0,1fr);gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line-soft);font-size:.9rem}
h2+.ev{border-top:0}
.imp{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;background:var(--warn)}
.imp.High{background:var(--red)} .imp.Medium{background:var(--orange)}
svg.chart{width:100%;height:auto;display:block}
.fld{display:grid;gap:4px;font-size:.84rem;color:var(--fg-2);min-width:0}
.calc{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
footer{padding-block:0 32px;font-size:.78rem;color:var(--fg-3);display:grid;gap:4px}
</style>

<header class="top">
  <div class="wrap top-row">
    <button class="iconbtn" type="button" id="menu-btn" aria-label="Menü öffnen" aria-controls="drawer" aria-expanded="false">
      <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M2 4h14M2 9h14M2 14h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <span class="top-title" id="top-title">Übersicht</span>
    <a class="brand" href="#start" aria-label="WorlᗡDriver Startseite">Worl<i class="m">D</i><i>D</i>river</a>
  </div>
</header>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Menü"></aside>
<main class="wrap" id="app"></main>
<footer class="wrap" id="foot"></footer>

<script>
const D = /*__WORLDDRIVER_DATA__*/null;
const $ = (s) => document.querySelector(s);
const nf = (d) => new Intl.NumberFormat("de-DE", {minimumFractionDigits: d, maximumFractionDigits: d});
const fmt = (x, d = 2) => x == null || isNaN(x) ? "–" : nf(d).format(x);
const pct = (x, d = 1, sign = false) => x == null || isNaN(x) ? "–" : (sign && x > 0 ? "+" : "") + nf(d).format(x * 100) + " %";
const dateDe = (s) => s ? new Date(s.length === 10 ? s + "T12:00:00" : s).toLocaleDateString("de-DE", {day: "2-digit", month: "2-digit", year: "numeric"}) : "–";
const pairName = (p) => p.slice(0, 3) + "/" + p.slice(3);
const digits = (p) => p.endsWith("JPY") ? 3 : 5;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const INFO = '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M8 7v4M8 4.6v.1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>';
const PERIODS = {entdeckung: "Entdeckung", bestaetigung: "Bestätigung", schlusstest: "Schlusstest"};
const state = {h: "1W", sort: "share", period: "schlusstest"};
try { Object.assign(state, JSON.parse(localStorage.getItem("wd2") || "{}")); } catch (e) {}
const save = () => { try { localStorage.setItem("wd2", JSON.stringify({h: state.h, sort: state.sort, period: state.period})); } catch (e) {} };

const S = () => D.signals;
const H = () => S().horizons[state.h] || Object.values(S().horizons)[0];
const SIG = Object.fromEntries((D ? D.signals.signals : []).map((s) => [s.key, s]));
const voteCls = (v) => v > 0 ? "long" : v < 0 ? "short" : "";
const voteTxt = (v) => v > 0 ? "long" : v < 0 ? "short" : "neutral";
const labelCls = (l) => l.includes("long") ? "long" : l.includes("short") ? "short" : "";
const lastPrice = (p) => { const r = D.prices[p]; return r && r.length ? r[r.length - 1][1] : null; };
const rangeOf = (p, h) => ((D.ranges.pairs[p] || {})[h || state.h]) || {};

function horizonSwitch() {
  return `<div class="seg" role="group" aria-label="Zeitraum">${Object.entries(S().horizons).map(([h, x]) =>
    `<button type="button" data-h="${h}" aria-pressed="${state.h === h}">${x.label}</button>`).join("")}</div>`;
}
function bindHorizon() { document.querySelectorAll("[data-h]").forEach((b) => b.onclick = () => { state.h = b.dataset.h; save(); route(); }); }
function voteBar(v) {
  const t = Math.max(v.total, 1);
  return `<div class="votebar" role="img" aria-label="${v.bull} long, ${v.neutral} neutral, ${v.bear} short"><i class="u" style="width:${v.bull / t * 100}%"></i><i class="n" style="width:${v.neutral / t * 100}%"></i><i class="d" style="width:${v.bear / t * 100}%"></i></div>`;
}
function shareTxt(v) { return v.share_bull == null ? "keine Stimme" : v.share_bull >= 0.5 ? `${pct(v.share_bull, 0)} long` : `${pct(1 - v.share_bull, 0)} short`; }
function bucketHit(test, label) {
  const b = (test.buckets || {})[label];
  return !b || b.hit == null ? "–" : `<b>${pct(b.hit, 1)}</b> <span class="faint">(95-%-Bereich ${fmt(b.ci[0] * 100, 0)}–${fmt(b.ci[1] * 100, 0)} %)</span>`;
}
function statusBox() {
  const rows = Object.values(S().horizons).map((x) => `<li><b>${x.label}:</b> ${x.valid.length} von ${S().rules.tests} Kombinationen bestanden. Die Fundamental-Mehrheit lag seit 2020 in <b>${pct(x.fundamental.test.all.hit, 1)}</b> der Fälle richtig (Zufall = 50 %).</li>`).join("");
  const any = Object.values(S().horizons).some((x) => x.valid.length);
  return `<div class="honest">${INFO}<div><b>${any ? "Es gibt geprüfte Signale." : "Noch kein Signal hat die Prüfung bestanden."}</b>
    ${any ? "" : "Die Abstimmung unten zählt deshalb die Fundamental-Signale in ihrer erwarteten Richtung. Sie beschreibt die Lage – eine belegte Vorhersage ist sie nicht."}
    <ul style="margin:6px 0;padding-left:18px">${rows}</ul><a href="#pruefung">So wird geprüft</a></div></div>`;
}

/* ---------- Übersicht ---------- */
function viewStart() {
  const h = H(), checked = h.checked.pairs, fund = h.fundamental.pairs;
  const pairs = [...D.pairs];
  if (state.sort === "share") pairs.sort((a, b) => Math.abs((fund[b].share_bull ?? .5) - .5) - Math.abs((fund[a].share_bull ?? .5) - .5));
  const rows = pairs.map((p) => {
    const f = fund[p], c = checked[p], r = rangeOf(p);
    const ev = D.events.filter((e) => e.impact === "High" && p.includes(e.currency)).length;
    return `<a class="row" href="#paar-${p}">
      <span class="c-p"><span class="pair">${pairName(p)}</span><br><span class="faint small num">${fmt(r.price ?? lastPrice(p), digits(p))}</span></span>
      <span class="c-b">${voteBar(f)}<span class="meta"><span>${f.bull} long · ${f.neutral} neutral · ${f.bear} short</span><span>${c.total ? `geprüft: ${shareTxt(c)}` : "geprüft: –"}</span></span></span>
      <span class="c-r rng"><span class="num">${r.pips != null ? `±${r.pips} Pips` : "–"}</span><br><span class="faint small">${ev ? `${ev} rote Termine` : "keine roten Termine"}</span></span>
      <span class="c-l" style="justify-self:end"><span class="pill ${labelCls(f.label)}">${esc(f.label)}</span></span></a>`; }).join("");
  return `<section class="view">
    <div class="lede"><h1>Wohin zeigen die Signale?</h1>
      <p>Für jedes Paar zählen wir, wie viele Signale aus Zinsen, Zinserwartung, Inflation, Arbeitsmarkt, Positionierung (COT), Saison, Risikostimmung und Rohstoffen gerade für long oder short stimmen.</p></div>
    ${statusBox()}
    <div class="toolbar">${horizonSwitch()}
      <label class="faint small">Sortieren <select id="sort"><option value="share" ${state.sort === "share" ? "selected" : ""}>deutlichste Mehrheit</option><option value="az" ${state.sort === "az" ? "selected" : ""}>A–Z</option></select></label></div>
    <p class="faint small">Balken: grün long, grau neutral, orange short · Spanne: 80-%-Bereich bis ${state.h === "1D" ? "zum nächsten Handelstag" : "in 5 Handelstagen"} · Signale vom ${dateDe(h.fundamental.date)}</p>
    <div class="rows">${rows}</div>
  </section>`;
}
function bindStart() { bindHorizon(); $("#sort").onchange = (e) => { state.sort = e.target.value; save(); route(); }; }

/* ---------- Paar ---------- */
function viewPair(p) {
  const h = H(), f = h.fundamental.pairs[p], c = h.checked.pairs[p], r = rangeOf(p);
  const base = p.slice(0, 3), quote = p.slice(3);
  const valid = new Set(h.valid.filter(([, ccy]) => ccy === base || ccy === quote).map(([k]) => k));
  const byFam = {};
  S().signals.forEach((s) => { if (s.key in f.votes || valid.has(s.key)) (byFam[s.family] = byFam[s.family] || []).push(s); });
  const rec = (k, ccy) => { const x = h.stats[k].ccy[ccy]; return `${ccy} ${x ? pct(x.schlusstest[0], 1, true) : "–"}`; };
  const list = Object.entries(byFam).map(([fam, items]) => `<div class="fam">${esc(fam)}</div>${items.map((s) => {
    const v = f.votes[s.key] ?? (c.votes || {})[s.key] ?? 0;
    return `<div class="sig"><span><b>${esc(s.label)}</b>${valid.has(s.key) ? ' <span class="pill good">geprüft</span>' : ""}<br><span class="muted small">${esc(s.idea)}</span></span>
      <span class="pill ${voteCls(v)}">${voteTxt(v)}</span>
      <span class="rec">Ergebnis seit 2020, Rendite pro Jahr nach Kosten: ${rec(s.key, base)} · ${rec(s.key, quote)}</span></div>`; }).join("")}`).join("");
  const ev = D.events.filter((e) => [base, quote].includes(e.currency) && e.impact !== "Low");
  return `<section class="view">
    <div class="toolbar"><a href="#start" class="small">← Übersicht</a>${horizonSwitch()}</div>
    <div class="lede"><h1>${pairName(p)}</h1><p class="num">${fmt(r.price ?? lastPrice(p), digits(p))} · Kurs vom ${dateDe(D.meta.as_of)}</p></div>
    <div class="grid-2">
      <article class="panel"><div class="panel-head"><h2>Abstimmung ${h.label}</h2><span class="pill ${labelCls(f.label)}">${esc(f.label)}</span></div>
        <div class="big num">${shareTxt(f)}</div>${voteBar(f)}
        <p class="muted small">${f.bull} von ${f.total} Signalen long, ${f.bear} short, ${f.neutral} ohne Aussage.</p>
        <p class="small">So oft lag „${esc(f.label)}“ seit 2020 richtig: ${bucketHit(h.fundamental.test, f.label)}</p>
        <p class="faint small">${c.total ? `Geprüfte Signale: ${shareTxt(c)} (${c.bull} long, ${c.bear} short).` : "Für dieses Paar hat noch kein Signal die Prüfung bestanden – diese Abstimmung ist ungeprüft."}</p></article>
      <article class="panel"><div class="panel-head"><h2>Erwartete Spanne</h2><span class="faint small">80 %</span></div>
        ${r.low != null ? `<div class="big num" style="font-size:1.8rem">±${r.pips} Pips</div>
        <dl class="kv"><dt>Unten</dt><dd class="num">${fmt(r.low, digits(p))}</dd><dt>Oben</dt><dd class="num">${fmt(r.high, digits(p))}</dd><dt>bis</dt><dd>${dateDe(r.target)}</dd>
        <dt>So oft traf die Spanne im Test</dt><dd class="num">${pct(D.ranges.coverage_backtest[state.h], 0)}</dd></dl>
        <p class="faint small">Mit 80 % Wahrscheinlichkeit liegt der Kurs dann in diesem Bereich. Diese Vorhersage funktioniert nachweislich – über die Richtung sagt sie nichts.</p>` : '<p class="muted">Noch keine Prognose im Ledger.</p>'}</article>
    </div>
    <article class="panel"><div class="panel-head"><h2>Die Signale im Einzelnen</h2><span class="faint small">Stand ${dateDe(h.fundamental.date)}</span></div><div>${list}</div></article>
    <article class="panel"><h2>Termine diese Woche</h2>${ev.length ? ev.map(evRow).join("") : '<p class="muted">Keine wichtigen Termine für diese Währungen.</p>'}</article>
    <article class="panel"><h2>Kursverlauf (6 Monate)</h2>${priceChart(p)}</article>
  </section>`;
}
function evRow(e) {
  return `<div class="ev"><span class="faint num small">${new Date(e.at).toLocaleDateString("de-DE", {weekday: "short", day: "2-digit"})}<br>${e.time}</span><b>${e.currency}</b><span><span class="imp ${e.impact}"></span>${esc(e.title)}${e.forecast || e.previous ? `<br><span class="faint small">Erwartet ${esc(e.forecast || "–")} · zuvor ${esc(e.previous || "–")}${e.actual ? ` · <b>Ist ${esc(e.actual)}</b>` : ""}</span>` : ""}</span></div>`;
}
function priceChart(p) {
  const pts = D.prices[p] || [], v = pts.map((x) => x[1]); if (v.length < 2) return "";
  const W = 600, Hh = 140, mn = Math.min(...v), mx = Math.max(...v), y = (x) => Hh - 6 - (x - mn) / ((mx - mn) || 1) * (Hh - 12);
  const d = v.map((x, i) => (i ? "L" : "M") + (i / (v.length - 1) * W).toFixed(1) + "," + y(x).toFixed(1)).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${Hh}" role="img" aria-label="Kursverlauf ${pairName(p)}"><path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2"/></svg>
    <div class="toolbar faint small num"><span>${dateDe(pts[0][0])}</span><span>Tief ${fmt(mn, digits(p))} · Hoch ${fmt(mx, digits(p))}</span></div>`;
}

/* ---------- Prüfung ---------- */
function viewCheck() {
  const h = H(), sig = S().signals, rules = S().rules, t = h.fundamental.test;
  const valid = new Set(h.valid.map(([k, c]) => k + c));
  const cell = (x, ok) => { if (!x || x[0] == null) return '<td class="cell faint">–</td>';
    const strong = Math.min(1, Math.abs(x[1]) / 3);
    return `<td class="cell" style="background:color-mix(in srgb,var(${x[0] >= 0 ? "--bull" : "--bear"}) ${Math.round(strong * 45)}%,transparent)" title="t-Wert ${fmt(x[1], 1)}">${pct(x[0], 1, true)}${ok ? " ✓" : ""}</td>`; };
  const rows = sig.map((s) => `<tr><td>${esc(s.label)}<br><span class="faint small">${esc(s.family)}</span></td>${D.majors.map((c) => {
    const x = h.stats[s.key].ccy[c]; return x ? cell(x[state.period], valid.has(s.key + c)) : '<td class="cell faint">–</td>'; }).join("")}</tr>`).join("");
  return `<section class="view">
    <div class="lede"><h1>Kann ich dem trauen?</h1>
      <p>Jedes Signal wurde für jede Währung über 27 Jahre gegen die tatsächliche Kursentwicklung getestet – mit ${pct(rules.cost, 2)} Kosten pro Trade und nur mit Daten, die am jeweiligen Tag schon veröffentlicht waren.</p></div>
    <div class="toolbar">${horizonSwitch()}</div>
    <div class="kpis">
      <div class="panel kpi"><span class="faint small">Geprüfte Kombinationen</span><b class="num">${rules.tests}</b><span class="faint small">${sig.length} Signale × 8 Währungen</span></div>
      <div class="panel kpi"><span class="faint small">Bestanden</span><b class="num" style="color:var(${h.valid.length ? "--good" : "--warn"})">${h.valid.length}</b><span class="faint small">Entdeckung und Bestätigung</span></div>
      <div class="panel kpi"><span class="faint small">Fundamental-Mehrheit seit 2020</span><b class="num">${pct(t.all.hit, 1)}</b><span class="faint small">richtig, Zufall = 50 %</span></div></div>
    <article class="panel"><h2>Die Regeln in drei Schritten</h2>
      <ol style="margin:0;padding-left:20px;display:grid;gap:6px" class="muted">
        <li><b>Entdeckung 1999–2012:</b> Hat das Signal nach Kosten Geld verdient – auch nachdem berücksichtigt ist, dass ${rules.tests} Kombinationen gleichzeitig getestet wurden? (Benjamini-Hochberg, ${pct(rules.fdr, 0)}). Sonst ist es vermutlich Zufall.</li>
        <li><b>Bestätigung 2013–2019:</b> Funktioniert es danach weiter (t-Wert über ${fmt(rules.confirm_t, 0)})?</li>
        <li><b>Schlusstest ab 2020:</b> Wird für keine Entscheidung genutzt. Er zeigt ehrlich, was danach passiert ist.</li></ol>
      <p class="small">Nur Signale, die Schritt 1 und 2 bestehen, kommen in die <b>geprüfte Abstimmung</b>. Die <b>Fundamental-Abstimmung</b> zählt dagegen alle ${sig.filter((s) => s.fundamental).length} Fundamental-Signale in ihrer erwarteten Richtung, ohne Prüfung.</p></article>
    <article class="panel"><div class="panel-head"><h2>Fundamental-Mehrheit seit ${dateDe(t.from)}</h2><span class="faint small">vor Kosten</span></div>
      <div class="tbl-wrap"><table><thead><tr><th>Stufe</th><th>Fälle</th><th>Richtig</th><th>95-%-Bereich</th></tr></thead><tbody>
      ${Object.entries(t.buckets).map(([k, b]) => `<tr><td>${esc(k)}</td><td class="cell">${nf(0).format(b.n)}</td><td class="cell">${pct(b.hit, 1)}</td><td class="cell">${b.ci ? pct(b.ci[0], 0) + "–" + pct(b.ci[1], 0) : "–"}</td></tr>`).join("")}</tbody></table></div>
      <p class="faint small">Enthält der 95-%-Bereich die 50 %, ist die Stufe nicht von Zufall zu unterscheiden.</p></article>
    <article class="panel"><div class="panel-head"><h2>Alle Signale je Währung</h2>
      <div class="seg" role="group" aria-label="Prüfzeitraum">${Object.entries(PERIODS).map(([k, l]) => `<button type="button" data-per="${k}" aria-pressed="${state.period === k}">${l}</button>`).join("")}</div></div>
      <p class="faint small">Rendite pro Jahr nach Kosten, wenn man dem Signal bei allen 7 Paaren der Währung gefolgt wäre. Kräftige Farbe = statistisch deutlicher. ✓ = bestanden.</p>
      <div class="tbl-wrap"><table><thead><tr><th>Signal</th>${D.majors.map((c) => `<th>${c}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div></article>
  </section>`;
}
function bindCheck() { bindHorizon(); document.querySelectorAll("[data-per]").forEach((b) => b.onclick = () => { state.period = b.dataset.per; save(); route(); }); }

/* ---------- Kalender ---------- */
function viewCalendar() {
  const imp = state.imp || ["High", "Medium"], ev = D.events.filter((e) => imp.includes(e.impact));
  const days = [...new Set(ev.map((e) => e.day))];
  return `<section class="view">
    <div class="lede"><h1>Termine KW ${D.meta.week.kw}</h1><p>Wirtschaftsdaten und Notenbank-Termine der 8 Währungen, deutsche Zeit. Quelle: ${esc(D.meta.calendar_source)}.</p></div>
    <div class="seg" role="group" aria-label="Wichtigkeit">${[["High", "hoch"], ["Medium", "mittel"], ["Low", "gering"]].map(([k, l]) => `<button type="button" data-imp="${k}" aria-pressed="${imp.includes(k)}"><span class="imp ${k}"></span>${l}</button>`).join("")}</div>
    ${days.map((d) => `<article class="panel"><h2>${new Date(d + "T12:00:00").toLocaleDateString("de-DE", {weekday: "long", day: "numeric", month: "long"})}</h2>${ev.filter((e) => e.day === d).map(evRow).join("")}</article>`).join("") || '<p class="muted">Keine Termine.</p>'}
  </section>`;
}
function bindCalendar() { document.querySelectorAll("[data-imp]").forEach((b) => b.onclick = () => { const k = b.dataset.imp, cur = state.imp || ["High", "Medium"]; state.imp = cur.includes(k) ? cur.filter((x) => x !== k) : [...cur, k]; route(); }); }

/* ---------- Rechner ---------- */
function usdPer() {
  const u = {USD: 1, EUR: lastPrice("EURUSD"), GBP: lastPrice("GBPUSD"), AUD: lastPrice("AUDUSD"), NZD: lastPrice("NZDUSD")};
  ["CAD", "CHF", "JPY"].forEach((c) => { u[c] = 1 / lastPrice("USD" + c); });
  return u;
}
function viewCalc() {
  const s = state.calc || {pair: "EURUSD", acct: "EUR", size: 10000, risk: 1, sl: 25};
  const fld = (id, label, val, step) => `<label class="fld"><span>${label}</span><input id="c-${id}" type="number" inputmode="decimal" min="0" step="${step}" value="${val}"></label>`;
  return `<section class="view">
    <div class="lede"><h1>Positionsgröße</h1><p>Wie groß darf die Position sein, wenn du höchstens einen festen Anteil deines Kontos riskieren willst?</p></div>
    <article class="panel"><div class="calc">
      <label class="fld"><span>Paar</span><select id="c-pair">${D.pairs.map((p) => `<option value="${p}" ${p === s.pair ? "selected" : ""}>${pairName(p)}</option>`).join("")}</select></label>
      <label class="fld"><span>Kontowährung</span><select id="c-acct">${D.majors.map((c) => `<option ${c === s.acct ? "selected" : ""}>${c}</option>`).join("")}</select></label>
      ${fld("size", "Kontogröße", s.size, 100)}${fld("risk", "Risiko pro Trade (%)", s.risk, 0.1)}${fld("sl", "Stop-Loss (Pips)", s.sl, 1)}</div></article>
    <article class="panel" id="c-out"></article>
    <p class="faint small">Kurse vom ${dateDe(D.meta.as_of)}. Pip = 0,0001 (JPY-Paare 0,01), 1 Lot = 100.000 Einheiten. Dein Broker kann leicht abweichen.</p>
  </section>`;
}
function bindCalc() {
  const ids = ["pair", "acct", "size", "risk", "sl"], u = usdPer();
  const calc = () => {
    const v = Object.fromEntries(ids.map((k) => [k, $("#c-" + k).value])), p = v.pair;
    state.calc = {...v, size: +v.size, risk: +v.risk, sl: +v.sl};
    const pipVal = (p.endsWith("JPY") ? 0.01 : 0.0001) * 100000 * (u[p.slice(3)] / u[v.acct]);
    const riskAmt = state.calc.size * state.calc.risk / 100, lots = state.calc.sl > 0 ? riskAmt / (state.calc.sl * pipVal) : 0;
    const day = rangeOf(p, "1D").pips;
    $("#c-out").innerHTML = `<div class="big num" style="color:var(--accent)">${fmt(lots, 2)} Lots</div>
      <dl class="kv"><dt>Risiko</dt><dd class="num">${fmt(riskAmt, 2)} ${v.acct}</dd><dt>Pip-Wert je Lot</dt><dd class="num">${fmt(pipVal, 2)} ${v.acct}</dd><dt>Typische Tagesspanne (80 %)</dt><dd class="num">±${day ?? "–"} Pips</dd></dl>
      ${day && state.calc.sl < day * 0.5 ? `<div class="honest">${INFO}<span>Dein Stop ist kleiner als die Hälfte der typischen Tagesspanne. Er wird leicht vom normalen Auf und Ab ausgelöst.</span></div>` : ""}`;
  };
  ids.forEach((k) => $("#c-" + k).addEventListener("input", calc)); calc();
}

/* ---------- Daten ---------- */
function viewData() {
  const a = S().audit, stale = a.filter((x) => !x.fresh);
  return `<section class="view">
    <div class="lede"><h1>Datenstand</h1><p>Jede Datenreihe mit ihrem letzten Wert und den Signalen, die sie speist. Veraltete Werte fließen in kein Signal ein.</p></div>
    ${stale.length ? `<div class="honest">${INFO}<span><b>${stale.length} Reihen sind veraltet</b> und deshalb abgeschaltet: ${stale.map((x) => esc(x.description)).join(", ")}.</span></div>` : ""}
    <article class="panel"><div class="tbl-wrap"><table><thead><tr><th>Reihe</th><th>Währung</th><th>letzter Wert</th><th>Status</th><th>speist</th></tr></thead><tbody>
      ${a.map((x) => `<tr><td>${esc(x.description || x.code)}</td><td>${x.currency || "–"}</td><td class="cell">${dateDe(x.last)}</td><td><span class="pill ${x.fresh ? "good" : "bad"}">${x.fresh ? "aktuell" : "veraltet"}</span></td><td class="faint small" style="text-align:left">${x.used_by.map((k) => esc((SIG[k] || {}).label || k)).join(", ")}</td></tr>`).join("")}</tbody></table></div></article>
    <article class="panel"><h2>Letzte Abrufe</h2><dl class="kv">${D.runs.map((r) => `<dt>${esc(r.source)}</dt><dd class="num small">${r.last_run ? new Date(r.last_run).toLocaleString("de-DE") : "–"}</dd>`).join("")}</dl></article>
    <article class="panel"><h2>Offene Qualitätsbefunde</h2>${D.quality.length ? `<dl class="kv">${D.quality.map((q) => `<dt>${esc(q.check)} (${esc(q.severity)})</dt><dd class="num">${q.count}</dd>`).join("")}</dl>` : '<p class="muted">Keine.</p>'}</article>
  </section>`;
}

/* ---------- Menü und Routing ---------- */
const NAV = [["start", "Übersicht"], ["pruefung", "Signal-Prüfung"], ["kalender", "Kalender"], ["rechner", "Rechner"], ["daten", "Datenstand"]];
const VIEWS = {start: ["Übersicht", viewStart, bindStart], pruefung: ["Signal-Prüfung", viewCheck, bindCheck],
  kalender: ["Kalender", viewCalendar, bindCalendar], rechner: ["Rechner", viewCalc, bindCalc], daten: ["Datenstand", viewData, () => {}]};
let cur = "start";
function renderDrawer() {
  $("#drawer").innerHTML = `<div class="toolbar"><a class="brand" href="#start">Worl<i class="m">D</i><i>D</i>river</a><button class="iconbtn" type="button" id="close-btn" aria-label="Menü schließen"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button></div>
    <nav aria-label="Bereiche">${NAV.map(([id, l]) => `<a href="#${id}" ${cur === id ? 'aria-current="page"' : ""}>${l}</a>`).join("")}</nav>
    <p class="faint small">Kurse bis ${dateDe(D.meta.as_of)} · KW ${D.meta.week.kw}</p>`;
  $("#close-btn").onclick = closeDrawer;
}
function openDrawer() { $("#drawer").classList.add("open"); $("#scrim").hidden = false; $("#menu-btn").setAttribute("aria-expanded", "true"); }
function closeDrawer() { $("#drawer").classList.remove("open"); $("#scrim").hidden = true; $("#menu-btn").setAttribute("aria-expanded", "false"); }
function route() {
  const name = (location.hash || "#start").slice(1);
  if (name.startsWith("paar-") && D.pairs.includes(name.slice(5))) {
    cur = "start"; $("#top-title").textContent = pairName(name.slice(5)); $("#app").innerHTML = viewPair(name.slice(5)); bindHorizon();
  } else {
    cur = VIEWS[name] ? name : "start";
    const [title, view, bind] = VIEWS[cur];
    $("#top-title").textContent = title; $("#app").innerHTML = view(); bind();
  }
  document.title = `${$("#top-title").textContent} · WorlᗡDriver`;
  closeDrawer(); renderDrawer();
}
if (!D) { $("#app").innerHTML = '<p class="muted">Keine Daten eingebettet. Die Seite wird mit „python -m forex_nexus build-site“ erzeugt.</p>'; }
else {
  $("#foot").innerHTML = `<div>WorlᗡDriver · Version ${esc(D.meta.code_commit)} · erzeugt ${new Date(D.meta.generated_at).toLocaleString("de-DE")}</div>
    <div>Kursbasis: ${esc(D.meta.price_basis)}. Persönliches Analysewerkzeug, keine Anlageberatung.</div>`;
  route();
  $("#menu-btn").onclick = openDrawer; $("#scrim").onclick = closeDrawer;
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeDrawer(); });
  window.addEventListener("hashchange", () => { route(); window.scrollTo(0, 0); });
}
</script>
