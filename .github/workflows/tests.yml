name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fnx
          POSTGRES_PASSWORD: fnx
          POSTGRES_DB: fnx
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fnx"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FNX_TEST_DATABASE_URL: postgresql://fnx:fnx@localhost:5432/fnx
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: pytest -v
